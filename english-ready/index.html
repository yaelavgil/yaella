<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>מוכן לאנגלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* Layout: one centered column of chunky "sticker" flash cards, echoing the class ABC deck. Hebrew RTL shell, English content LTR in a learner font. */
:root{
  /* A calmer set. The old one ran on six saturated accents — #D9480F, #C2185B, #6A3FD0 —
     all shouting at once, which read as a cheap game rather than something to learn from.
     These are the same six hues taken deeper and much less saturated, with paler tints,
     so colour can mean something (right, wrong, which subject) instead of decorating. */
  --bg:#FAF6F0; --surface:#FFFFFF; --ink:#242B38; --muted:#6B7280; --line:#E7E0D6; --shadow:#E2DAD0; --on:#FFFFFF; --ease:cubic-bezier(.2,.8,.2,1);
  --c1:#B2593A; --t1:#F4E4DB;  --c2:#3F6490; --t2:#E0E8F1;  --c3:#8E7034; --t3:#F2EADA;
  --c4:#44775B; --t4:#DEEAE2;  --c5:#6A5B8C; --t5:#E7E3EF;  --c6:#9D5468; --t6:#F2E2E6;
  --good:#3C7A57; --goodbg:#E0EFE6; --bad:#B14A43; --badbg:#F6E3E1;
  --f-display:"Fredoka","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,sans-serif;
  --f-en:"Andika","Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151927; --surface:#242B40; --ink:#F2EEE3; --muted:#A9AFC6; --line:#323A57; --shadow:#0B0E19; --on:#111522;
  --c1:#FF8A50; --t1:#45291B;  --c2:#78AEFF; --t2:#1B2D4C;  --c3:#F2C14E; --t3:#3F3418;
  --c4:#55D592; --t4:#173A29;  --c5:#B094FF; --t5:#2E2650;  --c6:#FF74A8; --t6:#461D30;
  --good:#5BD999; --goodbg:#173A28; --bad:#FF8379; --badbg:#46201E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151927; --surface:#242B40; --ink:#F2EEE3; --muted:#A9AFC6; --line:#323A57; --shadow:#0B0E19; --on:#111522;
  --c1:#FF8A50; --t1:#45291B;  --c2:#78AEFF; --t2:#1B2D4C;  --c3:#F2C14E; --t3:#3F3418;
  --c4:#55D592; --t4:#173A29;  --c5:#B094FF; --t5:#2E2650;  --c6:#FF74A8; --t6:#461D30;
  --good:#5BD999; --goodbg:#173A28; --bad:#FF8379; --badbg:#46201E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
#root{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.h1{--c:var(--c1);--t:var(--t1)} .h2{--c:var(--c2);--t:var(--t2)} .h3{--c:var(--c3);--t:var(--t3)}
.h4{--c:var(--c4);--t:var(--t4)} .h5{--c:var(--c5);--t:var(--t5)} .h6{--c:var(--c6);--t:var(--t6)}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stk{background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--shadow)}
.btn,.opt,.tile,.ab,.wrow{transition:transform .08s ease,box-shadow .08s ease}
.btn{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--shadow);padding:8px 16px;font-weight:600;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:40px;padding:4px 12px;font-size:15px;border-width:2px;box-shadow:0 3px 0 var(--shadow)}
.btn.primary{background:var(--c2);color:var(--on)}
.btn.icon{width:48px;padding:0;font-size:22px;flex:none}
.btn.on{background:var(--t1);border-color:var(--c1);color:var(--c1)}
canvas.erase{cursor:cell}
.btn:active,.opt:active:not(:disabled),.tile:active,.ab:active,.wrow:active{transform:translate(2px,2px);box-shadow:0 2px 0 var(--shadow)}
:focus-visible{outline:3px solid var(--c2);outline-offset:3px}
.link{background:none;border:0;padding:2px 4px;color:var(--c2);text-decoration:underline;font-size:15px}

/* home */
.hero{display:grid;gap:10px;padding-block:6px 20px}
.blocks{display:flex;gap:10px;direction:ltr;justify-content:flex-end}
.blk{width:54px;height:54px;display:grid;place-items:center;font:700 30px var(--f-display);color:var(--on);background:var(--c);border:2px solid var(--line);border-radius:13px;box-shadow:0 4px 0 var(--shadow)}
.blk:nth-child(1){transform:rotate(-6deg)} .blk:nth-child(2){transform:rotate(4deg)} .blk:nth-child(3){transform:rotate(-3deg)}
h1{font:700 clamp(34px,8vw,48px)/1.05 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 24px/1.2 var(--f-display);margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:17px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:600;font-size:14px}
.pill.due{background:var(--t3)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{display:flex;align-items:center;gap:12px;padding:14px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--shadow);min-height:96px;color:var(--ink)}
.tile.wide{grid-column:1/-1}
.tile.wide.fill{background:var(--t)}
.gl{flex:none;width:60px;height:60px;border-radius:15px;background:var(--t);color:var(--c);display:grid;place-items:center;font:700 26px/1 var(--f-en);border:2px solid var(--line);direction:ltr}
.tile.fill .gl{background:var(--surface)}
.gl.long{font-size:19px;white-space:nowrap}
.tx{display:grid;gap:3px;min-width:0}
.tx b{font:600 19px/1.2 var(--f-display)}
.tx small{color:var(--muted);font-family:var(--f-en);font-size:14px}
.chip{justify-self:start;font-size:12px;font-weight:700;background:var(--goodbg);color:var(--good);border-radius:999px;padding:1px 9px}
.tip{color:var(--muted);font-size:15px;margin:22px 0 0;max-width:60ch}
.warn{background:var(--badbg);border:2px solid var(--bad);border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:15px}

/* shared top bar */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ttl{font:600 21px/1.2 var(--f-display);flex:1;min-width:0}
.qnum{direction:ltr;unicode-bidi:isolate;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--c4);transition:width .3s}

/* quiz */
.qcard{padding:18px 16px;display:grid;gap:10px;justify-items:center;text-align:center;background:var(--t)}
.pic{font-size:clamp(64px,20vw,96px);line-height:1.15}
.ask{margin:0;font-size:18px;font-weight:500;text-wrap:balance}
.bigletter{font:700 clamp(80px,22vw,110px)/1 var(--f-en);color:var(--c)}
.sent{font:700 clamp(26px,6.5vw,38px)/1.3 var(--f-en);margin:0;text-wrap:balance}
.qen{font:700 clamp(22px,5.5vw,28px)/1.3 var(--f-en);margin:0}
.he{font-size:16px;color:var(--muted)}
.seq{font:700 clamp(40px,11vw,60px)/1.1 var(--f-en);letter-spacing:.12em;margin:0}
.seq u{text-decoration:none;display:inline-block;min-width:.8em;border-bottom:5px solid var(--c);color:transparent}
.word{font:700 clamp(40px,11vw,56px)/1.1 var(--f-en);margin:0}
.digit{font:700 clamp(80px,22vw,110px)/1 var(--f-display);color:var(--c)}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(34px,9vw,46px);max-width:340px;direction:ltr}
.wslots{display:flex;gap:6px;justify-content:center;margin-top:6px}
.wsl{width:clamp(30px,9vw,42px);height:clamp(40px,11vw,52px);border-bottom:4px solid var(--line);display:grid;place-items:center;font:700 clamp(26px,7vw,34px)/1 var(--f-en);color:var(--good)}
.wsl.cur{border-color:var(--c);animation:wslp 1.2s ease-in-out infinite}
.wsl.ok{border-color:var(--good)}
@keyframes wslp{50%{border-color:transparent}}
.wwbtns{margin-top:10px}
.cvwrap.wwdone{opacity:.45;pointer-events:none}
.wwword{font-size:24px}
.microw{display:flex;flex-direction:column;align-items:center;gap:8px;margin:18px 0 6px}
.micbtn{width:96px;height:96px;border-radius:50%;border:0;font-size:42px;background:linear-gradient(#FF8FB1,#E8547E);box-shadow:0 6px 0 #B83A60,0 10px 24px rgba(232,84,126,.35);cursor:pointer;color:#fff}
.micbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #B83A60}
.micbtn.on{animation:micp 1s ease-in-out infinite;background:linear-gradient(#7BD88F,#2F9E55);box-shadow:0 6px 0 #1F7A3E,0 0 0 10px rgba(47,158,85,.18)}
@keyframes micp{50%{box-shadow:0 6px 0 #1F7A3E,0 0 0 20px rgba(47,158,85,.08)}}
.michint{font-size:15px;color:var(--muted)}
.heard{display:block;font-size:15px;color:var(--muted);margin-top:4px}
.sgood{color:var(--good)}
.smiss{color:var(--bad);text-decoration:underline wavy}
.sayrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.opts.wide{grid-template-columns:1fr}
.opt{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--shadow);min-height:80px;padding:10px;font:700 34px/1.15 var(--f-en);display:grid;place-items:center;align-content:center;gap:4px}
.opts.emoji .opt{font-size:clamp(34px,11vw,56px);min-height:112px;font-family:var(--f-body)}
.opts.words .opt{font-size:clamp(22px,6vw,28px)}
.opts.digits .opt{font-family:var(--f-display);font-size:40px}
.opts.wide .opt{font-size:clamp(19px,5vw,24px);min-height:60px;justify-items:start;text-align:left;direction:ltr;padding:10px 16px}
.lab{font:400 15px/1.2 var(--f-en);color:var(--muted)}
.opt.ok{background:var(--goodbg);border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.opt.no{background:var(--badbg);border-color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.fb{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;border:2.5px solid var(--good);background:var(--goodbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb .msg{min-width:0;flex:1 1 220px;display:grid;gap:4px}
.fb .msg b{font:600 20px var(--f-display)}
.fb .btn{flex:1 1 140px}
.wfrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px}
.wfl{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-size:14px;font-weight:500}
.fb .msg .wfl b{font:700 19px/1 var(--f-en);direction:ltr;unicode-bidi:isolate;color:var(--ink)}
.wfl.ok{border-color:var(--good);color:var(--good)}
.wfl.bad{border-color:var(--bad);color:var(--bad)}
.rv{font-family:var(--f-en);font-size:20px}
.rv b{color:var(--c)}

.hintbox{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.fbbtns{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 260px}
.fbbtns .btn{flex:1 1 100px}
.ss.hl{background:var(--t3);outline:2px solid var(--c3)}
.sectable{width:100%;display:grid;gap:8px;text-align:start}
.secrow{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3em auto;align-items:center;gap:10px;min-height:44px}
.sname{font-weight:600}
.smeter{height:12px;border-radius:99px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.smeter i{display:block;height:100%;background:var(--good)}
.secrow.mid .smeter i{background:var(--c3)} .secrow.weak .smeter i{background:var(--bad)}
.sval{font-variant-numeric:tabular-nums;direction:ltr;text-align:center}
.sok{color:var(--good);font-weight:700;text-align:center}
@media (max-width:420px){.secrow{grid-template-columns:7em minmax(0,1fr) 2.6em auto;gap:6px}}

/* goal + zones */
.goal{padding:18px;display:grid;gap:10px;margin-bottom:20px;background:var(--t)}
.goalhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.glabel{font:600 20px var(--f-display)}
.gbig{font:700 clamp(30px,8vw,40px)/1 var(--f-display);color:var(--c)}
.gmeter{height:22px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden}
.gmeter i{display:block;height:100%;background:var(--c4);transition:width .4s}
.gleft{margin:0;font-size:20px}
.gleft b{font:700 clamp(24px,6vw,30px) var(--f-display);color:var(--c)}
.gnow{margin:0;color:var(--muted);font-size:15px}
.spinbtn{background:var(--c6);color:var(--on);font:700 20px var(--f-display);min-height:58px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.zone{display:grid;gap:10px;margin-bottom:22px;padding:16px;border-radius:22px;border:2.5px dashed var(--line)}
.zone.test{background:var(--badbg);border-style:solid;border-color:var(--bad)}
.zhead{display:flex;align-items:center;gap:10px}
.ztag,.mtag{font:700 14px var(--f-body);padding:2px 12px;border-radius:999px;color:var(--on);background:var(--c4);flex:none}
.zone.test .ztag,.mtag.test{background:var(--bad)}
.zdesc,.last{margin:0;max-width:62ch}
.last{font-size:15px;color:var(--muted)}
.testbtn{background:var(--bad);color:var(--on);font-size:18px;min-height:54px}
.parentlink{display:block;margin:14px 0 0}
/* wheel */
.wstage{position:relative;overflow:hidden;display:grid;justify-items:center;gap:12px;text-align:center;padding:20px 14px 22px;border-radius:26px;border:2px solid var(--line);box-shadow:0 5px 0 var(--shadow);color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#7B4DFF 0%,#4B21C9 45%,#2A0F86 100%)}
.wstage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(2px 2px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 82% 12%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 90% 60%,#FFE08A 50%,transparent 51%),radial-gradient(1.5px 1.5px at 8% 70%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 30% 92%,#FFE08A 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 88%,#fff 50%,transparent 51%)}
.whead{font:700 clamp(26px,7vw,34px)/1 var(--f-display);margin:0;letter-spacing:.01em;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.wheelwrap{position:relative;max-width:100%}
/* max-width used to squeeze the width while the inline height stayed put, so the wheel
   came out as an ellipse. Tie the height to the width and it stays round whatever happens. */
.wheelwrap canvas{display:block;max-width:100%;height:auto!important;aspect-ratio:1}
#confetti{position:absolute;inset:0;pointer-events:none}
.wlabel{min-height:1.6em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 clamp(18px,5vw,22px)/1.3 var(--f-en);background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 18px;max-width:100%}
.spinbig{font:700 clamp(26px,7vw,32px)/1 var(--f-display);letter-spacing:.06em;color:#3A1A00;min-width:220px;min-height:64px;padding:10px 28px;border-radius:999px;border:3px solid #fff;
  background:linear-gradient(180deg,#FFE27A 0%,#FFB020 100%);box-shadow:0 6px 0 #C77700,0 10px 22px rgba(0,0,0,.35);cursor:pointer;transition:transform .08s,box-shadow .08s}
.spinbig small{font-size:.6em;opacity:.8}
.spinbig:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #C77700,0 4px 10px rgba(0,0,0,.3)}
.spinbig:disabled{filter:grayscale(.6);opacity:.6;cursor:default}
.spinbig:not(:disabled){animation:pulse 1.6s ease-in-out infinite}
.wleft{margin:0;font-size:17px}
.wleft b{color:#FFE27A}
.prize{display:grid;gap:2px;justify-items:center;background:#fff;color:#2A0F86;border-radius:22px;padding:14px 22px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .5s both}
.prize p{margin:0}
.pwin{font:700 18px var(--f-display);color:#FF3B6B}
.pemoji{font-size:44px;line-height:1.1}
.ptext{font:700 clamp(20px,5.5vw,26px)/1.25 var(--f-en)}
.pnote{font-size:15px;color:#5B4A99}
/* parents */
.pbox{padding:18px;display:grid;gap:10px}
.pbox h2{margin-top:8px}
.pbox p{margin:0}
.pq{font:700 26px var(--f-display);align-self:center}
.pin{font:600 20px var(--f-body);width:6em;min-height:48px;padding:6px 10px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.pfield{display:flex;align-items:center;gap:8px;font-weight:600}
.ptext-in{width:100%;font-size:17px;line-height:1.6;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);direction:ltr;text-align:left}
.wins{margin:0;padding-inline-start:20px;display:grid;gap:4px}

.casebadge{display:inline-flex;align-items:center;gap:10px;font:700 clamp(26px,7vw,34px)/1 var(--f-display);padding:10px 20px;border-radius:16px;border:3px solid var(--line);box-shadow:0 4px 0 var(--shadow);background:var(--c);color:var(--on)}
.casebadge .en{font-size:.8em;background:var(--surface);color:var(--c);border-radius:10px;padding:4px 10px}
.casebadge.up{background:var(--c2)} .casebadge.up .en{color:var(--c2)}
.casebadge.low{background:var(--c6)} .casebadge.low .en{color:var(--c6)}
.dict{flex-direction:column;align-items:flex-start}
.dict p{flex:none}
.lvlrow{display:flex;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.lvlup{display:grid;gap:8px;justify-items:center;background:var(--t4);border-radius:14px;padding:12px 16px;width:100%}
u.gap{text-decoration:none;display:inline-block;min-width:.7em;border-bottom:5px solid var(--c);color:transparent}
.pbox h3{font:600 18px var(--f-display);margin:6px 0 0}
.parentrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:16px}
.gmark{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#4285F4;font:700 16px Arial,sans-serif;border:1px solid #dadce0}
.gbtn{font-size:18px;min-height:54px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.plist{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.pdash{display:grid;gap:16px}
.who{margin:0;color:var(--muted)}
.kidcard{padding:16px;display:grid;gap:10px}
.kchead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kstats{margin:0}
.links{display:grid;gap:8px}
.linkrow{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto auto;gap:8px;align-items:center}
.lmode{font-weight:700;font-size:14px;padding:2px 10px;border-radius:999px;text-align:center;color:var(--on);background:var(--c4)}
.lmode.test{background:var(--bad)} .lmode.all{background:var(--c2)}
.lurl{min-width:0;width:100%;font:13px var(--f-body);direction:ltr;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
a.btn{text-decoration:none}
@media (max-width:520px){.linkrow{grid-template-columns:1fr 1fr}.lmode,.lurl{grid-column:1/-1}}
.pin.wide{width:100%;max-width:20em}
.packs{display:grid;gap:8px}
.pack{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.pack small{grid-column:2;color:var(--muted)}
.pack.soon{opacity:.55;cursor:default}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:22px;height:22px}
.danger{border-color:var(--bad)}
.previewnote{background:var(--t3);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-weight:600}
.myprog{width:100%;margin-top:4px;font-size:17px}
.bignum{font:700 30px var(--f-display);margin:0}
.bignum small{font-size:16px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.wday{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;align-content:center;font:700 20px var(--f-display);background:var(--surface)}
.wday small{font:500 12px var(--f-body);color:var(--muted)}
.wday.on{background:var(--goodbg);color:var(--good)}
.mocklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mocklist li{display:grid;grid-template-columns:4em 3.5em minmax(0,1fr);gap:10px;align-items:center}
.bests{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.modal{position:fixed;inset:0;z-index:75;align-items:start !important;background:rgba(10,14,28,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.mbox{background:var(--bg);border:2px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:12px;width:min(420px,100%);display:grid;gap:10px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mbox .previewnote{margin:0}
.hebtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font:600 15px var(--f-body);box-shadow:0 3px 0 var(--shadow);min-height:40px}
.hebtn:active{transform:translate(1px,1px);box-shadow:0 2px 0 var(--shadow)}
.heicon{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--on);font:700 16px var(--f-display)}
.hebtn[aria-expanded="true"]{background:var(--t)}
.hebubble{margin:0;position:relative;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 16px;font:500 19px/1.4 var(--f-body);color:var(--ink);animation:pop .25s both}
.qtools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.heicon{font-size:15px}
.sfxbtn{position:fixed;z-index:40;left:calc(12px + env(safe-area-inset-left, 0px));bottom:calc(12px + env(safe-area-inset-bottom, 0px));width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--shadow);font-size:20px;display:grid;place-items:center;padding:0}
.sfxbtn:active{transform:translate(1px,1px);box-shadow:0 2px 0 var(--shadow)}
#root{padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px))}
/* ===== design layer: illustrations, softer surfaces, motion ===== */
body{background:var(--bg);background-image:radial-gradient(700px 380px at 105% -5%,var(--t3),transparent 60%),radial-gradient(600px 360px at -10% 30%,var(--t2),transparent 60%);background-attachment:fixed}
.ji{height:1.25em;width:auto;vertical-align:-.28em;display:inline-block;user-select:none;-webkit-user-drag:none}
.pic .ji{height:1.05em;animation:floaty 3.4s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(40,30,80,.18))}
.pic .ji + .ji{animation-delay:.4s}
.opts.emoji .opt .ji{height:1.05em;filter:drop-shadow(0 4px 6px rgba(40,30,80,.15))}
.count .ji{height:1.1em}
.wrow .em .ji{height:38px}
.btn .ji,.hebtn .ji,.link .ji,.chip .ji,.pill .ji{height:1.3em;vertical-align:-.32em}
.heicon .ji{height:20px}
.sfxbtn .ji{height:26px}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-2deg)}}
@keyframes rise{from{opacity:.4;transform:translateY(12px)}to{opacity:1;transform:none}}
#app > *{animation:rise .5s var(--ease) both}
#app > *:nth-child(2){animation-delay:.05s} #app > *:nth-child(3){animation-delay:.1s} #app > *:nth-child(4){animation-delay:.15s} #app > *:nth-child(5){animation-delay:.2s} #app > *:nth-child(6){animation-delay:.25s}
.tiles > *{animation:rise .5s var(--ease) both}
.tiles > *:nth-child(2){animation-delay:.06s} .tiles > *:nth-child(3){animation-delay:.12s} .tiles > *:nth-child(4){animation-delay:.18s} .tiles > *:nth-child(5){animation-delay:.24s} .tiles > *:nth-child(6){animation-delay:.3s} .tiles > *:nth-child(7){animation-delay:.36s}
.opts > *{animation:rise .4s var(--ease) both}
.opts > *:nth-child(2){animation-delay:.05s} .opts > *:nth-child(3){animation-delay:.1s} .opts > *:nth-child(4){animation-delay:.15s}
.btn,.opt,.tile,.ab,.wrow,.hebtn{transition:transform .18s var(--ease),box-shadow .18s var(--ease),background-color .2s,border-color .2s}
@media (hover:hover){
  .btn:hover:not(:disabled),.tile:hover,.ab:hover,.wrow:hover,.opt:hover:not(:disabled),.hebtn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--shadow),0 10px 20px rgba(60,40,10,.08)}
}
.btn:active:not(:disabled),.opt:active:not(:disabled),.tile:active,.ab:active,.wrow:active,.hebtn:active{transform:translateY(3px) scale(.98);box-shadow:0 1px 0 var(--shadow)}
.stk,.tile,.opt,.btn,.ab,.wrow{box-shadow:0 4px 0 var(--shadow),0 8px 18px rgba(60,40,10,.06)}
.btn.primary{background:var(--c2);color:#fff;border-color:transparent;box-shadow:0 4px 0 #1647A0,0 8px 18px rgba(28,100,200,.25)}
.btn.primary:hover:not(:disabled){box-shadow:0 6px 0 #1647A0,0 12px 22px rgba(28,100,200,.28)}
.testbtn{border-color:transparent;box-shadow:0 4px 0 #8E1B1B,0 8px 18px rgba(198,40,40,.25)!important}
.spinbtn{border-color:transparent;box-shadow:0 4px 0 #8A0F45,0 8px 18px rgba(194,24,91,.25)!important}
.opt.ok{animation:okpop .45s var(--ease)}
@keyframes okpop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.bar{border:none;background:var(--line);height:12px}
.bar i{background:linear-gradient(90deg,#4FD18B,#1E8A50);border-radius:99px;transition:width .6s var(--ease);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.gmeter{border:none;background:var(--surface);box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.gmeter i{background:linear-gradient(90deg,#FFC94D,#FF8A3D);border-radius:99px;transition:width .8s var(--ease)}
/* hero */
.hero{position:relative;padding-inline-end:clamp(110px,30vw,190px);min-height:150px}
.heroart{position:absolute;inset-inline-end:0;top:0;width:clamp(110px,30vw,180px);aspect-ratio:1}
.ha{position:absolute;line-height:1}
.ha .ji{height:100%;width:auto;filter:drop-shadow(0 10px 14px rgba(40,30,80,.18))}
.a1{inset:22% 8% auto auto;height:62%;animation:floaty 4s ease-in-out infinite}
.a2{inset:0 auto auto 6%;height:40%;animation:floaty 3.2s ease-in-out .6s infinite}
.a3{inset:auto auto 4% 10%;height:26%;animation:twinkle 2.6s ease-in-out infinite}
.a4{inset:2% 0 auto auto;height:22%;animation:twinkle 3s ease-in-out .9s infinite}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.8) rotate(12deg);opacity:.75}}
.blocks{justify-content:flex-end}
.blk{border-width:0;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.blk.h1{background:#FF7A3D}.blk.h2{background:#4D8DFF}.blk.h4{background:#22C3A6}
/* tiles with illustrations */
.gl{width:64px;height:64px;border-radius:20px;border:none;background:var(--t);font-size:40px}
.gl .ji{height:44px;transition:transform .3s var(--ease)}
.tile:hover .gl .ji{transform:rotate(-6deg) scale(1.08)}
.tile.wide .gl{width:72px;height:72px}
.zone{border-width:2px}
.zico{font-size:30px;line-height:1}
.zico .ji{height:34px}
.qstars{font:700 16px var(--f-display);background:var(--t3);border-radius:999px;padding:2px 10px 2px 12px;display:inline-flex;align-items:center;gap:4px}
.qstars .ji{height:20px;vertical-align:-4px}
.flystar{position:fixed;z-index:60;width:40px;height:40px;pointer-events:none;font-size:34px;line-height:40px;text-align:center}
.flystar .ji{height:40px}
.qcard{border-width:2px}
.opt{border-width:2px}
.pemoji .ji{height:64px;animation:floaty 3s ease-in-out infinite}
.wlabel .ji{height:1.2em}
.prize .ji{height:1.3em}
@media (prefers-reduced-motion:reduce){.pic .ji,.ha,.bar i::after{animation:none!important}}
.qtop{gap:8px}
.qtop .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtag{font-size:12px;padding:2px 9px}
@media (max-width:420px){.qtop .ttl{font-size:18px}.qnum{font-size:14px}}
.optwrap{position:relative;display:grid}
.optsay{position:absolute;top:8px;inset-inline-start:8px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;font-size:18px;box-shadow:0 2px 0 var(--shadow);z-index:1;transition:transform .15s var(--ease)}
.optsay:hover{transform:scale(1.08)}
.optsay:active{transform:scale(.92)}
.optsay .ji{height:22px}
.peekwheel{justify-self:center;display:grid;gap:8px;justify-items:center;background:none;border:0;padding:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .18s var(--ease)}
.peekwheel:hover{transform:scale(1.05)}
.peekwheel:active{transform:scale(.95)}
.peekwheel .mw{width:clamp(132px,38vw,168px);height:auto;filter:drop-shadow(0 8px 14px rgba(40,20,80,.3))}
.peekwheel .mwspin{transform-origin:50px 50px;animation:mwturn 26s linear infinite}
@keyframes mwturn{to{transform:rotate(360deg)}}
.peekwheel:hover .mwspin{animation-duration:6s}
.pwcap{font:700 15px var(--f-display);color:var(--c3);background:#fff;border:2px solid var(--line);border-radius:99px;padding:5px 14px;box-shadow:0 2px 0 var(--shadow)}
@media (prefers-reduced-motion:reduce){.peekwheel .mwspin{animation:none}}
.locked{display:grid;gap:8px;justify-items:center;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:22px;padding:14px 18px;width:100%;max-width:340px}
.lockrow{display:flex;align-items:center;gap:8px;font:600 17px var(--f-display);color:#FFE9A8}
.lockico .ji{height:26px}
.lockbig{margin:0;font:700 clamp(22px,6vw,28px)/1.25 var(--f-display);color:#fff;text-wrap:balance}
.lockbig b{color:#FFD23F;font-size:1.25em}
.lockmeter{width:100%;height:14px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.lockmeter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFE27A,#FFB020)}
.locknote{margin:0;font-size:15px;color:#E6DEFF}
.spinbig.gohome{font-size:clamp(20px,5.5vw,24px);letter-spacing:0;animation:none}
.wlabel.hint{font-family:var(--f-body);font-weight:600;font-size:clamp(16px,4.5vw,19px);direction:rtl}
.sharebtn{background:#25D366;color:#fff;border-color:transparent;box-shadow:0 4px 0 #128C4B!important;font-size:17px;margin-top:6px;text-decoration:none}
.sharenote{margin:0;font-size:13px;color:#5B4A99}
.prize .hebtn{margin-top:4px}
.prize .hebubble{background:#F3EEFF;border-color:#D9CCFF;color:#2A0F86}
.winov{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:16px;background:rgba(20,8,60,.55);backdrop-filter:blur(3px);animation:fadein .3s ease both}
.winov.out{animation:fadeout .25s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}} @keyframes fadeout{to{opacity:0}}
.winconf{position:fixed;inset:0;pointer-events:none}
.wincard{position:relative;width:min(420px,100%);display:grid;justify-items:center;gap:6px;text-align:center;background:#fff;color:#2A0F86;border-radius:28px;padding:22px 20px 18px;box-shadow:0 0 0 6px #FFD23F,0 20px 60px rgba(0,0,0,.4)}
.wtitle{margin:0;font:700 clamp(28px,8vw,40px)/1 var(--f-display);color:#FF3B6B}
.wemoji{font-size:96px;line-height:1}
.wemoji .ji{height:110px;filter:drop-shadow(0 10px 14px rgba(40,30,80,.25))}
.wincard.ready .wemoji .ji,.winov.ready .wemoji .ji{animation:floaty 3s ease-in-out infinite}
.wtext{margin:0;font:700 clamp(24px,7vw,32px)/1.2 var(--f-en);text-wrap:balance}
.wdetails{display:grid;gap:8px;justify-items:center;width:100%;opacity:0;transform:translateY(10px);transition:opacity .4s ease,transform .4s var(--ease);pointer-events:none}
.winov.ready .wdetails{opacity:1;transform:none;pointer-events:auto}
.wclose{min-height:44px;font-size:15px}
.wincard .hebubble{background:#F3EEFF;border-color:#D9CCFF;color:#2A0F86}
@media (prefers-reduced-motion:reduce){.winov,.winov.out{animation:none}}
/* story */
.story{padding:16px;margin-bottom:14px}
.sthead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sthead b{font:700 22px var(--f-en)}
.stx{font:400 clamp(20px,5vw,23px)/1.75 var(--f-en);margin:8px 0 0;direction:ltr;text-align:left}
.ss{cursor:pointer;border-radius:6px;padding:0 2px}
.ss:hover{background:var(--t3)}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.pts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px;text-align:start}
.pts li{position:relative;padding-inline-start:18px;line-height:1.45}
.pts li::before{content:"";position:absolute;inset-inline-start:3px;top:.6em;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.4}
.pts.hint{font-size:14px}
.jrest .pts,.giftbox .pts,.fb .pts{margin-top:4px}

/* results */
.result{padding:26px 18px;text-align:center;display:grid;gap:12px;justify-items:center}
.score{font:700 64px/1 var(--f-display);font-variant-numeric:tabular-nums}
.starrow{font-size:44px;letter-spacing:6px}
.starrow span{display:inline-block;animation:pop .5s both}
.starrow span:nth-child(2){animation-delay:.15s} .starrow span:nth-child(3){animation-delay:.3s}
.review{width:100%;text-align:start;background:var(--bg);border-radius:14px;padding:12px 16px}
.review ul{margin:6px 0 0;padding-inline-start:20px;display:grid;gap:4px}
.review li{font-family:var(--f-en);direction:ltr;text-align:right;unicode-bidi:plaintext}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.row.center{justify-content:center}

/* ABC */
.lead{margin:0 0 14px;color:var(--muted)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;direction:ltr}
.ab{aspect-ratio:1;font:700 28px var(--f-en);color:var(--c);background:var(--surface);border:2px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--shadow)}
.acard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px;align-items:center;padding:22px;border-radius:24px;background:var(--t);border:2px solid var(--line)}
.flash{position:relative;cursor:pointer;padding:0;aspect-ratio:3/4;width:100%;display:grid;place-items:center;font:700 clamp(84px,17vw,128px)/1 var(--f-en);color:var(--c);transform:rotate(-3deg);text-shadow:0 4px 0 var(--shadow)}
.flash .tap{position:absolute;bottom:10px;left:0;right:0;font:600 14px var(--f-body);color:var(--muted);text-shadow:none;direction:rtl}
.flash:active{transform:rotate(-3deg) translate(2px,2px)}
.aside{display:grid;gap:12px;min-width:0}
.sndrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.he-snd{font:700 32px/1 var(--f-display);color:var(--c)}
.note{margin:0;font-size:15px;background:var(--surface);border-radius:12px;padding:6px 12px;border:2px dashed var(--line)}
.wrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px;direction:ltr;text-align:left;color:var(--ink)}
.wrow .em{font-size:32px;width:54px;height:54px;flex:none;border-radius:50%;background:var(--t);display:grid;place-items:center}
.wrow .w{font:700 clamp(22px,5vw,28px) var(--f-en);flex:1;min-width:0}
.wrow .w b{color:var(--c)}
.wrow .spk{font-size:18px;opacity:.7}
.nav{justify-content:space-between}

/* writing */
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--shadow);background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 16px;font-weight:600;min-height:44px}
.seg button + button{border-inline-start:2px solid var(--line)}
.seg button.on{background:var(--c4);color:var(--on)}
.wctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.strip{display:flex;gap:6px;overflow-x:auto;direction:ltr;padding:4px 2px 12px;scrollbar-width:thin}
.strip button{flex:none;width:46px;height:46px;border-radius:11px;border:2px solid var(--line);background:var(--surface);color:var(--c);font:700 22px var(--f-en)}
.strip button.on{background:var(--c);color:var(--on)}
.dict{padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--t)}
.wmodel{font:700 54px/1 var(--f-en);letter-spacing:10px;color:var(--ink)}
.wround{margin:0 0 8px;font:700 16px var(--f-display);color:var(--muted)}
.dict p{margin:0;font-size:18px}
.cvwrap{position:relative;overflow:hidden;touch-action:none;height:260px}
.cvwrap canvas{position:absolute;inset:0;touch-action:none}

@media (max-width:560px){
  .acard{grid-template-columns:1fr;padding:16px}
  .flash{width:62%;justify-self:center;aspect-ratio:1}
}
@media (max-width:400px){
  .tile:not(.wide){flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------------------------------------------------------------
   Quieter chrome. Everything used to shout in the same voice — the
   answer, the "read it to me" helper and the translation all had the
   same thick border and hard drop shadow, so nothing led the eye.
   Helpers are now flat tinted chips; the things you act on keep the
   weight. Softer, shallower shadows throughout.
   --------------------------------------------------------------- */
.btn{border-width:1.5px;border-radius:13px;box-shadow:0 1px 1px rgba(31,42,68,.05),0 3px 8px rgba(31,42,68,.07)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 2px rgba(31,42,68,.08)}
.btn.primary{box-shadow:0 2px 4px rgba(28,100,200,.22),0 8px 18px rgba(28,100,200,.20)}
.btn.primary:hover:not(:disabled){box-shadow:0 3px 6px rgba(28,100,200,.24),0 12px 24px rgba(28,100,200,.22)}
.btn:disabled{opacity:.55}

/* helper chips: present, but clearly secondary */
.hebtn,.sthead .btn.sm,.sayrow .btn.sm,.qtools .btn.sm{
  background:var(--t,#F1EEE6);color:var(--c,var(--ink));border:1px solid rgba(31,42,68,.10);
  box-shadow:none;border-radius:999px;min-height:36px;font:600 14.5px var(--f-body)}
.hebtn{padding:3px 14px 3px 5px;gap:7px}
.sthead .btn.sm,.sayrow .btn.sm,.qtools .btn.sm{padding:4px 14px}

// --- kid side: progress is written to the cloud a moment after each change
let cloudTimer = 0, cloudDirty = false, cloudBusy = false, cloudFails = 0;
// Every change is kept on the device straight away (save() above) and pushed to the cloud
// a moment later. A push that fails (no signal, a hiccup) is retried with a growing pause
// instead of being forgotten, and anything still unsent is pushed again when the page is
// opened, brought back to the front, or the network returns. If the tab dies first, the
// device copy is newer and bootKid() sends it up next time.
function cloudSoon() { cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudFlush, 1500); }
async function cloudFlush() {
  clearTimeout(cloudTimer); cloudTimer = 0;
  if (!KID || !cloudDirty || PENDING_RESET) return; // a reset is waiting: never send the old progress over it
  if (cloudBusy) { cloudTimer = setTimeout(cloudFlush, 800); return; }
  cloudBusy = true;
  const snap = KID.progress, stamp = snap.updatedAt;
  try {
    await (await api()).saveProgress(KID.id, snap);
    cloudFails = 0;
    if (KID.progress.updatedAt === stamp) cloudDirty = false;
  } catch (e) {
    cloudFails++;
  }
  cloudBusy = false;
  if (cloudDirty) cloudTimer = setTimeout(cloudFlush, cloudFails ? Math.min(60000, 2000 * 2 ** Math.min(cloudFails, 5)) : 800);
}
document.addEventListener('visibilitychange', () => { if (KID) { if (document.visibilityState === 'hidden') cloudFlush(); else if (cloudDirty) cloudFlush(); } });
window.addEventListener('pagehide', () => { if (KID) cloudFlush(); });
window.addEventListener('online', () => { if (KID && cloudDirty) { cloudFails = 0; cloudFlush(); } });

    const cp = k.progress || {}, progress = local && (local.updatedAt || 0) > (cp.updatedAt || 0) && (local.resetAt || 0) >= (cp.resetAt || 0) ? local : cp; // a parent's reset beats an older device copy

// one tap: the child's own link, in their own mode, ready to send
function sendKidLink(btn, k) {
  if (!k) return;
  const url = kidLink(k.id, kidMode(k));
  const txt = `${k.name}, הנה הקישור שלך לתרגול באנגלית:\n${url}`;
  try { navigator.clipboard.writeText(url); } catch (e) {}
  if (navigator.canShare && matchMedia('(pointer: coarse)').matches) {
    navigator.share({ text: txt }).catch(() => {});
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
  }
  const was = btn.textContent; btn.textContent = 'הקישור הועתק';
  setTimeout(() => { btn.textContent = was; }, 2200);
}

async function winCardBlob(pz, at) {

  x.fillStyle = '#fff'; roundRect(x, 58, 58, W - 116, H - 116, 56); x.fill(); x.restore();
  }

  x.textAlign = 'center'; x.direction = 'rtl';

  // ribbon
  x.fillStyle = '#FFEDB8'; roundRect(x, W / 2 - 170, 112, 340, 68, 34); x.fill();
  x.fillStyle = '#A8740C'; x.font = f(BOD, 34, 700);
  x.fillText('מוכן לאנגלית', W / 2, 157);

  // the kid's own photo, in a ring in the corner of the card
  if (KID && KID.photo) {
    const ph = await loadUrl(KID.photo);
    if (ph) {
      const R = 78, cx = 176, cy = 176, k = Math.max(2 * R / ph.width, 2 * R / ph.height);
      x.save(); x.shadowColor = 'rgba(80,60,30,.25)'; x.shadowBlur = 18; x.shadowOffsetY = 6;
      x.beginPath(); x.arc(cx, cy, R + 8, 0, Math.PI * 2); x.fillStyle = '#FFD23F'; x.fill(); x.restore();

  x.fillText('אחרי אימונים קשים באנגלית', W / 2, 268);

  const who = (KID && KID.name) ? KID.name : '';
  x.fillStyle = '#1F2A44'; x.font = f(DIS, 92);
  x.fillText(who ? `${who} זוכה!` : 'זכייה!', W / 2, 372);

  // the prize illustration
  const parentUrl = artMap()[textOf(pz)];
  const art = parentUrl ? await loadUrl(parentUrl) : await loadArt(prizeSlug(pz));
  const im = art ? null : await loadIll(emojiOf(pz));
  if (art) { const k = Math.min(440 / art.width, 400 / art.height); x.drawImage(art, W / 2 - art.width * k / 2, 410 + (400 - art.height * k) / 2, art.width * k, art.height * k); }
  else if (im) x.drawImage(im, W / 2 - 170, 420, 340, 340);
  else { x.font = f(DIS, 240); x.fillText(emojiOf(pz), W / 2, 700); }

  // what was won
  x.direction = 'ltr'; x.fillStyle = '#D9480F'; x.font = f(EN, 60);
  let y = 850;
  for (const ln of wrapLines(x, textOf(pz), W - 240)) { x.fillText(ln, W / 2, y); y += 74; }

  x.direction = 'rtl'; const he = heOf(pz);

  const wit = pick(WIT);

  const st = winStamp(at || Date.now());

  x.fillText(st.when, W / 2, H - 126);
  x.font = f(EN, 26); x.direction = 'ltr'; x.fillStyle = '#C3C8D6';

}

function prepWin(pz, msg, at) {

document.addEventListener('click', e => {

  e.preventDefault();

  if (blob) {

/* ---------- say it out loud: the browser listens and checks the word (easy: hear it first / medium: read it / hard: read a sentence) ---------- */
const SRec = () => window.SpeechRecognition || window.webkitSpeechRecognition;
// words a speech engine often writes instead of the one a child said
const HOMO = { eye: ['i', 'aye', 'hi'], sun: ['son'], ant: ['aunt', 'and', 'end'], nut: ['not', 'knot', 'night'], owl: ['all', 'al', 'oil', 'out'], key: ['ki', 'kee', 'kiki', 'kay'], up: ['op', 'app'], egg: ['ag', 'ec', 'eg', 'act'], van: ['fan', 'ben', 'when'], car: ['far', 'call', 'ca'], cat: ['kat', 'cut', 'cap'], hat: ['hut', 'had', 'hot'], dog: ['dug', 'doug', 'duck'], two: ['to', 'too', '2'], four: ['for', '4'], eight: ['ate', '8'], one: ['won', '1'], bear: ['bare', 'bar', 'bird'], pear: ['pair', 'pare'], see: ['sea', 'c'], milk: ['mic', 'melk'], kite: ['kate', 'cat'], tree: ['three', 'tea'], frog: ['frock', 'fog'] };
const DIG = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const sxCode = w => { // soundex, with every vowel start treated alike
  const m = { b: 1, f: 1, p: 1, v: 1, c: 2, g: 2, j: 2, k: 2, q: 2, s: 2, x: 2, z: 2, d: 3, t: 3, l: 4, m: 5, n: 5, r: 6 };
  const f = /[aeiouy]/.test(w[0]) ? 'A' : w[0] === 'k' || w[0] === 'q' ? 'C' : w[0].toUpperCase();
  let out = f, prev = m[w[0]] || 0;
  for (const c of w.slice(1)) { const v = m[c] || 0; if (v && v !== prev) out += v; if (c !== 'h' && c !== 'w') prev = v; }
  return (out + '000').slice(0, 4);
};
function lev(a, b) { const d = [...Array(b.length + 1).keys()]; for (let i = 1; i <= a.length; i++) { let p = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1)); p = t; } } return d[b.length]; }

function speakView() {
  setLvl();
  const RND = SPEAK_ROUND; SPEAK_ROUND = false;
