<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:type" content="website">

<meta property="og:description" content="צלילים, אותיות, משפטים, הבנת הנקרא ומספרים עד 12. כמה דקות בכל יום.">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>מוכן לאנגלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700&display=swap">
</head>
<body>
<style>
/* Layout: one centered column of chunky "sticker" flash cards, echoing the class ABC deck. Hebrew RTL shell, English content LTR in a learner font. */
:root{
  --bg:#FFF6E6; --surface:#FFFDF7; --ink:#1F2A44; --muted:#5E6680; --line:#1F2A44; --shadow:#1F2A44; --on:#FFFFFF;
  --c1:#D9480F; --t1:#FFDCC4;  --c2:#1C64C8; --t2:#D3E5FF;  --c3:#A8740C; --t3:#FFEDB8;
  --c4:#1E8A50; --t4:#CBF1DB;  --c5:#6A3FD0; --t5:#E6DCFF;  --c6:#C2185B; --t6:#FFD3E4;
  --good:#1E7A47; --goodbg:#D5F5E3; --bad:#C62828; --badbg:#FFE1DE;
  --f-display:"Fredoka","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,sans-serif;
  --f-en:"Andika","Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151927; --surface:#242B40; --ink:#F2EEE3; --muted:#A9AFC6; --line:#06080F; --shadow:#06080F; --on:#111522;
  --c1:#FF8A50; --t1:#45291B;  --c2:#78AEFF; --t2:#1B2D4C;  --c3:#F2C14E; --t3:#3F3418;
  --c4:#55D592; --t4:#173A29;  --c5:#B094FF; --t5:#2E2650;  --c6:#FF74A8; --t6:#461D30;
  --good:#5BD999; --goodbg:#173A28; --bad:#FF8379; --badbg:#46201E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151927; --surface:#242B40; --ink:#F2EEE3; --muted:#A9AFC6; --line:#06080F; --shadow:#06080F; --on:#111522;
  --c1:#FF8A50; --t1:#45291B;  --c2:#78AEFF; --t2:#1B2D4C;  --c3:#F2C14E; --t3:#3F3418;
  --c4:#55D592; --t4:#173A29;  --c5:#B094FF; --t5:#2E2650;  --c6:#FF74A8; --t6:#461D30;
  --good:#5BD999; --goodbg:#173A28; --bad:#FF8379; --badbg:#46201E; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
#root{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
.h1{--c:var(--c1);--t:var(--t1)} .h2{--c:var(--c2);--t:var(--t2)} .h3{--c:var(--c3);--t:var(--t3)}
.h4{--c:var(--c4);--t:var(--t4)} .h5{--c:var(--c5);--t:var(--t5)} .h6{--c:var(--c6);--t:var(--t6)}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stk{background:var(--surface);border:2.5px solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--shadow)}
.btn,.opt,.tile,.ab,.wrow{transition:transform .08s ease,box-shadow .08s ease}
.btn{background:var(--surface);color:var(--ink);border:2.5px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--shadow);padding:8px 16px;font-weight:600;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:40px;padding:4px 12px;font-size:15px;border-width:2px;box-shadow:2px 2px 0 var(--shadow)}
.btn.primary{background:var(--c2);color:var(--on)}
.btn.icon{width:48px;padding:0;font-size:22px;flex:none}
.btn:active,.opt:active:not(:disabled),.tile:active,.ab:active,.wrow:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
:focus-visible{outline:3px solid var(--c2);outline-offset:3px}
.link{background:none;border:0;padding:2px 4px;color:var(--c2);text-decoration:underline;font-size:15px}

/* home */
.hero{display:grid;gap:10px;padding-block:6px 20px}
.blocks{display:flex;gap:10px;direction:ltr;justify-content:flex-end}
.blk{width:54px;height:54px;display:grid;place-items:center;font:700 30px var(--f-display);color:var(--on);background:var(--c);border:2.5px solid var(--line);border-radius:13px;box-shadow:3px 3px 0 var(--shadow)}
.blk:nth-child(1){transform:rotate(-6deg)} .blk:nth-child(2){transform:rotate(4deg)} .blk:nth-child(3){transform:rotate(-3deg)}
h1{font:700 clamp(34px,8vw,48px)/1.05 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 24px/1.2 var(--f-display);margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:17px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:600;font-size:14px}
.pill.due{background:var(--t3)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{display:flex;align-items:center;gap:12px;padding:14px;text-align:start;background:var(--surface);border:2.5px solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--shadow);min-height:96px;color:var(--ink)}
.tile.wide{grid-column:1/-1}
.tile.wide.fill{background:var(--t)}
.gl{flex:none;width:60px;height:60px;border-radius:15px;background:var(--t);color:var(--c);display:grid;place-items:center;font:700 26px/1 var(--f-en);border:2px solid var(--line);direction:ltr}
.tile.fill .gl{background:var(--surface)}
.gl.long{font-size:19px;white-space:nowrap}
.tx{display:grid;gap:3px;min-width:0}
.tx b{font:600 19px/1.2 var(--f-display)}
.tx small{color:var(--muted);font-family:var(--f-en);font-size:14px}
.chip{justify-self:start;font-size:12px;font-weight:700;background:var(--goodbg);color:var(--good);border-radius:999px;padding:1px 9px}
.tip{color:var(--muted);font-size:15px;margin:22px 0 0;max-width:60ch}
.warn{background:var(--badbg);border:2px solid var(--bad);border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:15px}

/* shared top bar */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ttl{font:600 21px/1.2 var(--f-display);flex:1;min-width:0}
.qnum{direction:ltr;unicode-bidi:isolate;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:99px;background:var(--surface);border:2px solid var(--line);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--c4);transition:width .3s}

/* quiz */
.qcard{padding:18px 16px;display:grid;gap:10px;justify-items:center;text-align:center;background:var(--t)}
.pic{font-size:clamp(64px,20vw,96px);line-height:1.15}
.ask{margin:0;font-size:18px;font-weight:500;text-wrap:balance}
.bigletter{font:700 clamp(80px,22vw,110px)/1 var(--f-en);color:var(--c)}
.sent{font:700 clamp(26px,6.5vw,38px)/1.3 var(--f-en);margin:0;text-wrap:balance}
.qen{font:700 clamp(22px,5.5vw,28px)/1.3 var(--f-en);margin:0}
.he{font-size:16px;color:var(--muted)}
.seq{font:700 clamp(40px,11vw,60px)/1.1 var(--f-en);letter-spacing:.12em;margin:0}
.seq u{text-decoration:none;display:inline-block;min-width:.8em;border-bottom:5px solid var(--c);color:transparent}
.word{font:700 clamp(40px,11vw,56px)/1.1 var(--f-en);margin:0}
.digit{font:700 clamp(80px,22vw,110px)/1 var(--f-display);color:var(--c)}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:clamp(34px,9vw,46px);max-width:340px;direction:ltr}
.sayrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.opts.wide{grid-template-columns:1fr}
.opt{background:var(--surface);color:var(--ink);border:2.5px solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--shadow);min-height:80px;padding:10px;font:700 34px/1.15 var(--f-en);display:grid;place-items:center;align-content:center;gap:4px}
.opts.emoji .opt{font-size:clamp(34px,11vw,56px);min-height:112px;font-family:var(--f-body)}
.opts.words .opt{font-size:clamp(22px,6vw,28px)}
.opts.digits .opt{font-family:var(--f-display);font-size:40px}
.opts.wide .opt{font-size:clamp(19px,5vw,24px);min-height:60px;justify-items:start;text-align:left;direction:ltr;padding:10px 16px}
.lab{font:400 15px/1.2 var(--f-en);color:var(--muted)}
.opt.ok{background:var(--goodbg);border-color:var(--good);box-shadow:3px 3px 0 var(--good)}
.opt.no{background:var(--badbg);border-color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.fb{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;border:2.5px solid var(--good);background:var(--goodbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb .msg{min-width:0;flex:1 1 220px;display:grid;gap:4px}
.fb .msg b{font:600 20px var(--f-display)}
.fb .btn{flex:1 1 140px}
.rv{font-family:var(--f-en);font-size:20px}
.rv b{color:var(--c)}

.hintbox{background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.fbbtns{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 260px}
.fbbtns .btn{flex:1 1 100px}
.ss.hl{background:var(--t3);outline:2px solid var(--c3)}
.sectable{width:100%;display:grid;gap:8px;text-align:start}
.secrow{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3em auto;align-items:center;gap:10px;min-height:44px}
.sname{font-weight:600}
.smeter{height:12px;border-radius:99px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.smeter i{display:block;height:100%;background:var(--good)}
.secrow.mid .smeter i{background:var(--c3)} .secrow.weak .smeter i{background:var(--bad)}
.sval{font-variant-numeric:tabular-nums;direction:ltr;text-align:center}
.sok{color:var(--good);font-weight:700;text-align:center}
@media (max-width:420px){.secrow{grid-template-columns:7em minmax(0,1fr) 2.6em auto;gap:6px}}

/* goal + zones */
.goal{padding:18px;display:grid;gap:10px;margin-bottom:20px;background:var(--t)}
.goalhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.glabel{font:600 20px var(--f-display)}
.gbig{font:700 clamp(30px,8vw,40px)/1 var(--f-display);color:var(--c)}
.gmeter{height:22px;border-radius:99px;background:var(--surface);border:2.5px solid var(--line);overflow:hidden}
.gmeter i{display:block;height:100%;background:var(--c4);transition:width .4s}
.gleft{margin:0;font-size:20px}
.gleft b{font:700 clamp(24px,6vw,30px) var(--f-display);color:var(--c)}
.gnow{margin:0;color:var(--muted);font-size:15px}
.spinbtn{background:var(--c6);color:var(--on);font:700 20px var(--f-display);min-height:58px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.zone{display:grid;gap:10px;margin-bottom:22px;padding:16px;border-radius:22px;border:2.5px dashed var(--line)}
.zone.test{background:var(--badbg);border-style:solid;border-color:var(--bad)}
.zhead{display:flex;align-items:center;gap:10px}
.ztag,.mtag{font:700 14px var(--f-body);padding:2px 12px;border-radius:999px;color:var(--on);background:var(--c4);flex:none}
.zone.test .ztag,.mtag.test{background:var(--bad)}
.zdesc,.last{margin:0;max-width:62ch}
.last{font-size:15px;color:var(--muted)}
.testbtn{background:var(--bad);color:var(--on);font-size:18px;min-height:54px}
.parentlink{display:block;margin:14px 0 0}
/* wheel */
.wheelbox{padding:18px;display:grid;justify-items:center;gap:14px;text-align:center}
.whead{font:700 26px var(--f-en);margin:0}
.wheelwrap{position:relative;max-width:100%}
.wheelwrap canvas{display:block;max-width:100%}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--ink);z-index:1;filter:drop-shadow(0 2px 0 var(--surface))}
.bigspin{font:700 22px var(--f-en);min-height:60px;min-width:200px}
.bigspin:disabled{opacity:.5}
.prize{padding:16px 20px;background:var(--t3);display:grid;gap:4px;animation:pop .5s both}
.prize p{margin:0}
.pwin{font-size:18px;color:var(--muted)}
.ptext{font:700 clamp(22px,6vw,28px)/1.25 var(--f-en)}
/* parents */
.pbox{padding:18px;display:grid;gap:10px}
.pbox h2{margin-top:8px}
.pbox p{margin:0}
.pq{font:700 26px var(--f-display);align-self:center}
.pin{font:600 20px var(--f-body);width:6em;min-height:48px;padding:6px 10px;border:2.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.pfield{display:flex;align-items:center;gap:8px;font-weight:600}
.ptext-in{width:100%;font-size:17px;line-height:1.6;padding:10px;border:2.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);direction:ltr;text-align:left}
.wins{margin:0;padding-inline-start:20px;display:grid;gap:4px}

.casebadge{display:inline-flex;align-items:center;gap:10px;font:700 clamp(26px,7vw,34px)/1 var(--f-display);padding:10px 20px;border-radius:16px;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);background:var(--c);color:var(--on)}
.casebadge .en{font-size:.8em;background:var(--surface);color:var(--c);border-radius:10px;padding:4px 10px}
.casebadge.up{background:var(--c2)} .casebadge.up .en{color:var(--c2)}
.casebadge.low{background:var(--c6)} .casebadge.low .en{color:var(--c6)}
.dict{flex-direction:column;align-items:flex-start}
.dict p{flex:none}
.lvlrow{display:flex;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.lvlup{display:grid;gap:8px;justify-items:center;background:var(--t4);border-radius:14px;padding:12px 16px;width:100%}
u.gap{text-decoration:none;display:inline-block;min-width:.7em;border-bottom:5px solid var(--c);color:transparent}
.pbox h3{font:600 18px var(--f-display);margin:6px 0 0}
.parentrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:16px}
.gmark{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:#4285F4;font:700 16px Arial,sans-serif;border:1px solid #dadce0}
.gbtn{font-size:18px;min-height:54px}
.loading{padding:30px;text-align:center;color:var(--muted)}
.plist{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.pdash{display:grid;gap:16px}
.who{margin:0;color:var(--muted)}
.kidcard{padding:16px;display:grid;gap:10px}
.kchead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kstats{margin:0}
.links{display:grid;gap:8px}
.linkrow{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto auto;gap:8px;align-items:center}
.lmode{font-weight:700;font-size:14px;padding:2px 10px;border-radius:999px;text-align:center;color:var(--on);background:var(--c4)}
.lmode.test{background:var(--bad)} .lmode.all{background:var(--c2)}
.lurl{min-width:0;width:100%;font:13px var(--f-body);direction:ltr;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
a.btn{text-decoration:none}
@media (max-width:520px){.linkrow{grid-template-columns:1fr 1fr}.lmode,.lurl{grid-column:1/-1}}
.pin.wide{width:100%;max-width:20em}
.packs{display:grid;gap:8px}
.pack{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.pack small{grid-column:2;color:var(--muted)}
.pack.soon{opacity:.55;cursor:default}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:22px;height:22px}
.danger{border-color:var(--bad)}
.previewnote{background:var(--t3);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-weight:600}
.myprog{width:100%;margin-top:4px;font-size:17px}
.bignum{font:700 30px var(--f-display);margin:0}
.bignum small{font-size:16px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px}
.wday{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;align-content:center;font:700 20px var(--f-display);background:var(--surface)}
.wday small{font:500 12px var(--f-body);color:var(--muted)}
.wday.on{background:var(--goodbg);color:var(--good)}
.mocklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mocklist li{display:grid;grid-template-columns:4em 3.5em minmax(0,1fr);gap:10px;align-items:center}
.bests{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,28,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.mbox{background:var(--bg);border:2.5px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--shadow);padding:12px;width:min(420px,100%);display:grid;gap:10px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mbox .previewnote{margin:0}
.hebtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font:600 15px var(--f-body);box-shadow:2px 2px 0 var(--shadow);min-height:40px}
.hebtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.heicon{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:var(--on);font:700 16px var(--f-display)}
.hebtn[aria-expanded="true"]{background:var(--t)}
.hebubble{margin:0;position:relative;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 16px;font:500 19px/1.4 var(--f-body);color:var(--ink);animation:pop .25s both}
.qtools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.heicon{font-size:15px}
/* story */
.story{padding:16px;margin-bottom:14px}
.sthead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sthead b{font:700 22px var(--f-en)}
.stx{font:400 clamp(20px,5vw,23px)/1.75 var(--f-en);margin:8px 0 0;direction:ltr;text-align:left}

  const my = ++token;
  try { player.pause(); } catch (e) {}
  if (canTTS) speechSynthesis.cancel();
  const parts = String(text).split('|').filter(Boolean);
  for (let i = 0; i < parts.length; i++) {
    if (my !== token) return;
    const ok = await clip(parts[i], slow);
    if (my !== token) return;
    if (!ok) await tts(parts[i], slow ? 0.5 : 0.85);
    if (i < parts.length - 1) await new Promise(r => setTimeout(r, 250));
  }
}
function hush() { token++; try { player.pause(); } catch (e) {} if (canTTS) speechSynthesis.cancel(); }
let primed = false;
document.addEventListener('pointerdown', () => {
  if (primed) return; primed = true;
  try { player.src = 'audio/silence.mp3'; const p = player.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  if (canTTS) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}, { capture: true });

const PROGRESS_KEYS = ['stars', 'days', 'done', 'best', 'td', 'mock', 'mocks', 'wins', 'level', 'updatedAt'];
const SETTING_KEYS = ['goal', 'prizes', 'wheel', 'level', 'testLevel', 'allowLevelUp', 'pack'];

// KID is set when the app is opened from a parent's link: settings come from the parent, progress is saved to the cloud
let KID = null;
function load() {
  if (KID) {
    const st = Object.assign(fresh(), KID.settings);
    Object.assign(st, Object.fromEntries(PROGRESS_KEYS.filter(k => KID.progress[k] !== undefined && k !== 'level').map(k => [k, KID.progress[k]])));
    if (KID.settings.allowLevelUp && KID.progress.level) st.level = KID.progress.level;
    return JSON.parse(JSON.stringify(st));
  }
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return Object.assign(fresh(), s); } catch (e) {} return fresh();
}
function save(s) {
  if (KID) {
    const pr = Object.fromEntries(PROGRESS_KEYS.filter(k => k !== 'level' && k !== 'updatedAt' && s[k] !== undefined).map(k => [k, s[k]]));
    if (KID.settings.allowLevelUp && s.level && s.level !== (KID.progress.level || KID.settings.level)) pr.level = s.level;
    else if (KID.progress.level) pr.level = KID.progress.level;
    pr.updatedAt = Date.now();
    KID.progress = pr;
    try { localStorage.setItem(KEY + ':' + KID.id, JSON.stringify(pr)); } catch (e) {}

function today() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function day(s) { const t = today(); if (!s.td || s.td.date !== t) s.td = { date: t, stars: 0, ms: 0, spins: 0 }; return s.td; }
function markDone(mod, pct) {
  const s = load(); s.done[mod] = today();
  if (pct != null) s.best[mod] = Math.max(s.best[mod] || 0, pct);
  if (!s.days.includes(today())) s.days.push(today());
  save(s);
}
function addStar() { const s = load(); s.stars++; day(s).stars++; save(s); }
// practice time: time between taps while inside a practice screen (gaps over 90s don't count)
let practicing = false, lastAct = 0;
document.addEventListener('pointerdown', () => {
  const now = Date.now();
  if (practicing && lastAct && now - lastAct < 90000) { const s = load(); day(s).ms += now - lastAct; save(s); }
  lastAct = practicing ? now : 0;
}, { capture: true });
function goalState(s) {
  const d = day(s), g = s.goal, mins = Math.floor(d.ms / 60000);
  const value = g.type === 'mins' ? mins : d.stars;
  const earned = Math.floor(value / g.n), avail = Math.max(0, earned - d.spins);
  const left = g.n * (earned + 1) - value;
  return { d, g, mins, value, earned, avail, left, unit: g.type === 'mins' ? 'דקות' : 'כוכבים', pct: Math.min(100, ((value % g.n) / g.n) * 100) };
}

function countdown() {
  const ex = new Date(2026, 10, 23); const t = new Date(); t.setHours(0, 0, 0, 0);
  const n = Math.round((ex - t) / 864e5);
  if (n > 1) return `עוד ${n} ימים למבחן · 23.11`;
  if (n === 1) return 'המבחן מחר. בהצלחה!';
  if (n === 0) return 'היום המבחן. בהצלחה!';
  return 'המבחן מאחוריך. ממשיכים לתרגל';
}

const VOW = 'aeiou';

function misspell(w) {

function build(gens, n) {
  const out = [], keys = new Set();

    // when two strokes start at the same spot, move the later number a little along its stroke
    let k0 = 0;
    while (k0 < st.length - 1 && dots.some(([x, y]) => Math.hypot(st[k0][0] - x, st[k0][1] - y) < r * 2.1)) k0++;
    const [sx, sy] = st[k0]; dots.push([sx, sy]);
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    ctx.fillStyle = css(document.body, '--on'); ctx.font = `700 ${Math.round(r * 1.25)}px Rubik, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(num, sx, sy + 1);
  }
  function drawGuide(partial) {
    const ctx = g.getContext('2d'); ctx.clearRect(0, 0, W, H);
    wrap.className = `cvwrap stk h${hueOf(curI())}`;
    const oy = geometry(), muted = css(document.body, '--muted'), col = css(wrap, '--c');
    const line = (y, w, dash, a) => { ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = muted; ctx.lineWidth = w; ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(10, y); ctx.lineTo(W - 10, y); ctx.stroke(); ctx.restore(); };
    line(oy, 1.5, [], 0.5); line(oy + U, 1.5, [8, 8], 0.5); line(oy + 2 * U, 2.5, [], 0.85); line(oy + 3 * U, 1.5, [], 0.35);
    if (!ghost && !partial) return;
    ctx.save(); ctx.globalAlpha = 0.25; ctx.strokeStyle = col; ctx.lineWidth = U * 0.26; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    strokesPx.flat().forEach(st => { path(ctx, st); ctx.stroke(); }); ctx.restore();
    if (partial) { // demo: draw strokes progressively
      ctx.save(); ctx.strokeStyle = css(document.body, '--ink'); ctx.lineWidth = Math.max(5, U * 0.09); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      let left = partial;
      for (const st of strokesPx.flat()) { if (left <= 0) break; const n = Math.min(st.length, left); path(ctx, st, n); ctx.stroke(); left -= st.length; }
      ctx.restore();
    }
    dots = [];
    strokesPx.forEach(gl => gl.forEach((st, j) => arrowsFor(ctx, st, j + 1, col)));
  }
  function demo() {
    cancelAnimationFrame(anim); const total = strokesPx.flat().reduce((a, st) => a + st.length, 0); let n = 0;
    const tick = () => { n += 2; drawGuide(n); if (n < total) anim = requestAnimationFrame(tick); else setTimeout(() => drawGuide(), 600); };
    anim = requestAnimationFrame(tick);
  }
  function clear() { d.getContext('2d').clearRect(0, 0, W, H); ink = []; $('#wfb').innerHTML = ''; }

  // drawing
  let drawing = false, last = null, idle = 0;
  const pt = e => { const r = d.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function seg(a, b) {
    const ctx = d.getContext('2d');
    ctx.strokeStyle = css(document.body, '--ink'); ctx.lineWidth = Math.max(5, U * 0.09); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 3));
    const cur = ink[ink.length - 1];
    for (let k = 1; k <= n; k++) cur.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
  }
  d.addEventListener('pointerdown', e => {
    e.preventDefault(); if (state !== 'draw') return; clearTimeout(idle);
    drawing = true; try { d.setPointerCapture(e.pointerId); } catch (_) {} last = pt(e); ink.push([last]); seg(last, [last[0] + 0.1, last[1]]);
  });
  d.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); seg(last, p); last = p; });
  ['pointerup', 'pointercancel'].forEach(t => d.addEventListener(t, () => {
    if (!drawing) return; drawing = false;
    if (mode === 'trace') { clearTimeout(idle); idle = setTimeout(() => check(true), 700); }
  }));

  function result(absolute) {
    const tpl = strokesPx.flat();
    if (ink.flat().length < 6) return false;
    if (absolute) { // on the guide lines the letter must also start and end at the right height
      const d = centre(ink.flat()), t = centre(tplPx);
      if (Math.abs(d.y0 - t.y0) > U * 0.45 || Math.abs(d.y1 - t.y1) > U * 0.45) return false;
      return matches(nudge(ink, tpl, U), tpl, U);
    }
    return matches(fitInto(ink, tpl), tpl, U);
  }
  function check(auto) {
    if (mode === 'trace') {
      if (won) return;
      const ok = result(true);
      if (ok) {
        won = true; addStar(); markDone('write');
        $('#wfb').innerHTML = `<div class="fb good"><div class="msg"><b><span class="en">${pick(PRAISE)}</span> ⭐ כתבת את האות נכון!</b></div><button class="btn primary" id="wnext">אות הבאה ←</button></div>`;
        $('#wnext').onclick = nextTrace;
        say(NAME[LETTERS[idx][0]]);
      } else if (!auto) {
        ghost = true; renderButtons(); drawGuide();
        $('#wfb').innerHTML = `<div class="fb bad"><div class="msg"><b>עוד לא מדויק.</b> נסה לכתוב על האות האפורה ולעקוב אחרי המספרים והחצים.</div><button class="btn" id="wagain">↻ לנסות שוב</button></div>`;
        $('#wagain').onclick = clear;
      }
      return;
    }
    // dictation
    state = 'checked'; ghost = true; drawGuide();
    const ok = result(false);
    if (ok) { addStar(); markDone('write'); }
    $('#wfb').innerHTML = ok
      ? `<div class="fb good"><div class="msg"><b><span class="en">${pick(PRAISE)}</span> ⭐ נכון!</b> השווה לאות שעל המסך.</div></div>`
      : `<div class="fb bad"><div class="msg"><b>עוד לא.</b> כך כותבים את האות. אפשר לנסות שוב.</div></div>`;
    renderButtons(ok);
  }
  function nextTrace() { idx = (idx + 1) % 26; won = false; clear(); render(); }
  function newDict() {
    let i; do { i = rint(0, 25); } while (dict && i === dict.i);
    dict = { i, cs: Math.random() < 0.5 ? 'up' : 'low' }; ghost = false; state = 'draw';
  }
  function renderButtons(ok) {
    const wb = $('#wb');
    if (mode === 'trace') {
      wb.innerHTML = `<button class="btn" id="clr">🧽 נקה</button>
        <button class="btn" id="demo">▶ איך כותבים</button>
        <button class="btn" id="gh">${ghost ? 'הסתר דוגמה' : 'הצג דוגמה'}</button>
        <button class="btn" id="chk">✓ בדוק אותי</button>
        <button class="btn primary" id="nxt">אות הבאה ←</button>`;
      $('#gh').onclick = () => { ghost = !ghost; renderButtons(); drawGuide(); };
      $('#demo').onclick = demo;
      $('#chk').onclick = () => check(false);
      $('#nxt').onclick = nextTrace;
    } else if (state === 'draw') {
      wb.innerHTML = `<button class="btn" id="clr">🧽 נקה</button><button class="btn primary" id="chk">✓ בדוק אותי</button>`;
      $('#chk').onclick = () => check(false);
    } else {
      wb.innerHTML = `<button class="btn" id="retry">↻ לנסות שוב</button><button class="btn" id="demo">▶ איך כותבים</button><button class="btn primary" id="nx">אות הבאה ←</button>`;
      $('#retry').onclick = () => { state = 'draw'; ghost = false; clear(); drawGuide(); renderButtons(); };
      $('#demo').onclick = demo;
      $('#nx').onclick = () => { newDict(); clear(); render(); say(NAME[LETTERS[dict.i][0]]); };
    }
    const c = $('#clr'); if (c) c.onclick = () => { clear(); won = false; };
  }
  function render() {
    $$('.seg [data-mode]', app).forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    const wt = $('#wtop');
    if (mode === 'trace') {
      wt.innerHTML = `<div class="strip" id="strip">${LETTERS.map((L, i) => `<button class="h${hueOf(i)}${i === idx ? ' on' : ''}" data-i="${i}" aria-label="${L[0]}">${L[0]}</button>`).join('')}</div>
        <div class="wctl"><div class="seg" role="group" aria-label="גודל אות">
          <button data-cs="up" class="${cs === 'up' ? 'on' : ''}">גדולה</button><button data-cs="low" class="${cs === 'low' ? 'on' : ''}">קטנה</button><button data-cs="both" class="${cs === 'both' ? 'on' : ''}">שתיהן</button></div>
          <button class="btn sm" data-say="${NAME[LETTERS[idx][0]]}">🔊 שם האות</button></div>
        <p class="hint">כותבים לפי המספרים והחצים: מתחילים בעיגול 1. כשהאות יוצאת נכון, מקבלים כוכב.</p>`;
      $$('#strip button').forEach(b => b.onclick = () => { idx = +b.dataset.i; won = false; clear(); render(); });
      $$('[data-cs]', wt).forEach(b => b.onclick = () => { cs = b.dataset.cs; won = false; clear(); render(); });
      const on = $('#strip .on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
    } else {
      const U_ = LETTERS[dict.i][0], up = dict.cs === 'up';
      wt.innerHTML = `<div class="dict stk h${hueOf(dict.i)}">
          <p>שמע את שם האות וכתוב אותה בתור</p>
          <span class="casebadge ${up ? 'up' : 'low'}">${up ? 'אות גדולה' : 'אות קטנה'} <span class="en">${up ? 'ABC' : 'abc'}</span></span>
          <div class="sayrow"><button class="btn sm" data-say="${NAME[U_]}">🔊 שמע שוב</button><button class="btn sm" data-say="${NAME[U_]}" data-slow="1">🐢 לאט</button></div>
        </div>`;
    }
    renderButtons();
    drawGuide();
  }
  $$('.seg [data-mode]', app).forEach(b => b.onclick = () => {
    if (b.dataset.mode === mode) return;
    mode = b.dataset.mode; won = false; clear();
    if (mode === 'dict') { newDict(); render(); say(NAME[LETTERS[dict.i][0]]); }
    else { ghost = true; state = 'draw'; render(); }
  });
  let lastW = -1;
  const ro = new ResizeObserver(() => { if (wrap.clientWidth !== lastW) { lastW = wrap.clientWidth; size(); } });
  ro.observe(wrap);
  cleanup = () => { ro.disconnect(); cancelAnimationFrame(anim); clearTimeout(idle); };
  render(); size();
  if (document.fonts) document.fonts.ready.then(() => drawGuide());
}

// every English phrase the app speaks (used to make the audio clips)
window.speechTexts = () => [...new Set([
  ...Object.values(NAME), ...WORDS.map(w => w.w), ...SENTENCES.map(x => x.s),
  ...STORIES.flatMap(st => st.x), ...STORIES.flatMap(st => st.q.map(q => q[0])), ...NW.slice(1),
  ...DEFAULT_PRIZES.map(t => t.replace(/\p{Extended_Pictographic}\uFE0F?/gu, '').trim()),
])];
const QS = new URLSearchParams(location.search);
if (QS.get('k') && CLOUD_OK) bootKid(QS.get('k'), QS.get('m') || 'all');
else home();
})();
</script>
