<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#FFF6E6;font-family:Rubik,sans-serif;color:#1F2A44;position:relative}
.blocks{position:absolute;top:58px;right:96px;display:flex;gap:14px;direction:ltr}
.b{width:74px;height:74px;border-radius:16px;border:4px solid #1F2A44;display:grid;place-items:center;font:700 44px Fredoka;color:#fff;box-shadow:0 6px 0 #1F2A44}
.b1{background:#E2541F;transform:rotate(-6deg)}.b2{background:#2563C9;transform:rotate(4deg)}.b3{background:#1F8A55;transform:rotate(-3deg)}
h1{position:absolute;top:150px;right:96px;margin:0;font:800 104px/1 Rubik}
.sub{position:absolute;top:278px;right:98px;margin:0;font:500 38px/1.3 Rubik;color:#4A5372;width:640px}
.chips{position:absolute;top:420px;right:96px;display:flex;gap:14px;flex-wrap:wrap;width:700px}
.c{font:700 28px Rubik;background:#fff;border:3px solid #1F2A44;border-radius:999px;padding:10px 22px;box-shadow:0 4px 0 #1F2A44}
.map{position:absolute;left:70px;top:70px;width:330px;height:490px}
.st{position:absolute;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:50px;border:4px solid #1F2A44;box-shadow:0 5px 0 #1F2A44}
svg{position:absolute;inset:0}
</style></head><body>
<div class="map">
  <svg width="330" height="490" viewBox="0 0 330 490"><path d="M60 440 C 240 420, 280 330, 170 280 S 40 150, 230 60" fill="none" stroke="#C9B48A" stroke-width="8" stroke-dasharray="4 18" stroke-linecap="round"/></svg>
  <div class="st" style="left:14px;top:394px;background:#FFE08A">⭐</div>
  <div class="st" style="left:180px;top:300px;background:#BFE3FF">🗺️</div>
  <div class="st" style="left:40px;top:180px;background:#E5DBFF">🌙</div>
  <div class="st" style="left:190px;top:16px;background:#FFD1DC">🎡</div>
</div>
<div class="blocks"><div class="b b1">A</div><div class="b b2">B</div><div class="b b3">C</div></div>
<h1>מאסטר אנגלית</h1>
<p class="sub">מסע אנגלית משלך, ברמה שלך.<br>כמה דקות ביום.</p>
<div class="chips"><span class="c">📖 קריאה</span><span class="c">✍️ כתיבה</span><span class="c">🗣 דיבור</span><span class="c">🎁 הפתעות</span></div>
</body></html>
