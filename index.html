<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yaella</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: a personal shelf of share-pages. Header, audience filter, then one row per page with a thumbnail, who it's for, and the two actions she needs: open and copy link */
:root{
  --bg:#f5f3ef; --paper:#ffffff; --ink:#1d1b20; --muted:#6c6670; --line:#e3ded6;
  --accent:#e2561f; --chip:#efebe5;
  --display:"Karantina","Arial Hebrew",Impact,sans-serif;
  --body:"Assistant","Arial Hebrew",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141216; --paper:#1d1a20; --ink:#f1ece6; --muted:#a39ca6; --line:#302b33; --accent:#ff7a45; --chip:#26222a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141216; --paper:#1d1a20; --ink:#f1ece6; --muted:#a39ca6; --line:#302b33; --accent:#ff7a45; --chip:#26222a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:36px 56px;display:grid;gap:22px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(52px,10vw,80px);line-height:.9;margin:0}
.sub{color:var(--muted);margin:6px 0 0;max-width:56ch}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters button:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.group h2{font-size:14px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:8px 0 10px}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px}
.thumb{width:88px;height:88px;border-radius:10px;object-fit:cover;background:var(--chip);display:grid;place-items:center;font-size:36px}
.meta{min-width:0;display:grid;gap:4px}
.meta h3{margin:0;font-size:18px;font-weight:800;line-height:1.25}
.meta p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;background:var(--chip);border-radius:6px;padding:1px 8px}
.tag.who{background:var(--accent);color:#fff}
.acts{display:grid;gap:6px;justify-items:stretch}
.act{font:inherit;font-size:14px;font-weight:700;text-align:center;text-decoration:none;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.act.open{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.act.copy{background:transparent;color:var(--ink);border:1px solid var(--line)}
.copied{color:var(--accent)!important;border-color:var(--accent)!important}
.empty{color:var(--muted);text-align:center;padding:24px}
.how{border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px;display:grid;gap:6px}
.how code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--chip);border-radius:4px;padding:1px 6px;direction:ltr;unicode-bidi:embed}
@media (max-width:560px){.row{grid-template-columns:64px minmax(0,1fr)}.thumb{width:64px;height:64px;font-size:28px}.acts{grid-column:1/-1;grid-template-columns:1fr 1fr}}
</style>
<style>body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>yaella</h1>
    <p class="sub">יאללה + יעל. כל הדפים שאני שולחת לחברים ולרועי, במקום אחד.</p>
  </header>

  <div class="filters" role="group" aria-label="סינון לפי למי">
    <button type="button" data-f="all" aria-pressed="true">הכל</button>
    <button type="button" data-f="חברים" aria-pressed="false">חברים</button>
    <button type="button" data-f="רועי" aria-pressed="false">רועי</button>
  </div>

  <div id="out"></div>

  <footer class="how">
    <p>הדפים כאן ציבוריים: כל מי שיש לו קישור יכול לפתוח אותם.</p>
    <p>סדר הקבצים: תיקייה אחת לכל נסיעה או נושא, למשל <code>ostrava-2027/</code>. הדף הראשי נמצא בתיקייה עצמה, ותת־נושאים בתיקיות משנה (<code>map/</code>, <code>photos/</code>). הרשימה כאן מגיעה מהמערך <code>PAGES</code> שבקובץ.</p>
  </footer>
</div>

<script>
// One entry per page. Newest first inside each group.
// path: a page inside this collection. url: an older page that lives in its own artifact.
var BASE = 'https://yaelavgil.github.io/yaella/';
var PAGES = [
  {slug:'ostrava', group:'טיול רובי וויליאמס · יולי 2027', title:'רובי באוסטרבה · מצטרפים?', who:'חברים', date:'2026-10-06',
   desc:'הדף הראשי של הטיול: הפסטיבל, המלונות שהזמנו, מחשבון עלויות ותזכורת ליומן.',
   path:'ostrava-2027/', thumb:'ostrava-2027/img/robbie.jpg'},
  {slug:'ostrava-map', group:'טיול רובי וויליאמס · יולי 2027', title:'הפסטיבל על המפה', who:'חברים', date:'2026-10-01',
   desc:'מרחקים מהפסטיבל למלונות, לקניונים ולמרכז.', path:'ostrava-2027/map/', emoji:'🗺️'},
  {slug:'ostrava-photos', group:'טיול רובי וויליאמס · יולי 2027', title:'הסביבה בתמונות', who:'חברים', date:'2026-09-30',
   desc:'הבסקידים, שטרמברק והוקוואלדי.', path:'ostrava-2027/photos/', thumb:'ostrava-2027/photos/img/pustevny_0.jpg'}
];

(function(){

  var out=document.getElementById('out'), filter='all';
  var fmt=function(d){var p=d.split('-');return +p[2]+'.'+(+p[1])+'.'+p[0]};
  function linkFor(p){return p.path?BASE+p.path:p.url}
  function render(){
    out.innerHTML='';
    var items=PAGES.filter(function(p){return filter==='all'||p.who===filter});
    if(!items.length){out.innerHTML='<p class="empty">אין עדיין דפים כאן.</p>';return}
    var groups={},order=[];
    items.forEach(function(p){if(!groups[p.group]){groups[p.group]=[];order.push(p.group)}groups[p.group].push(p)});
    order.forEach(function(g){
      var sec=document.createElement('section');sec.className='group';
      var h2=document.createElement('h2');h2.textContent=g;sec.appendChild(h2);
      var list=document.createElement('div');list.className='list';
      groups[g].sort(function(a,b){return a.date<b.date?1:-1}).forEach(function(p){
        var row=document.createElement('article');row.className='row';
        var th=p.thumb?'<img class="thumb" src="'+p.thumb+'" alt="">':'<div class="thumb" aria-hidden="true">'+(p.emoji||'📄')+'</div>';
        var href=p.path||p.url;
        row.innerHTML=th+
          '<div class="meta"><h3></h3><p class="d"></p><div class="tags"><span class="tag who"></span><span class="tag">'+fmt(p.date)+'</span>'+(p.url?'<span class="tag">דף נפרד</span>':'')+'</div></div>'+
          '<div class="acts"><a class="act open" href="'+href+'"'+(p.url?' target="_blank" rel="noopener"':'')+'>פתיחה</a><button type="button" class="act copy">העתקת קישור</button></div>';
        row.querySelector('h3').textContent=p.title;
        row.querySelector('.d').textContent=p.desc;
        row.querySelector('.who').textContent='ל'+p.who;
        var b=row.querySelector('.copy');
        b.addEventListener('click',function(){
          var t=linkFor(p),o=b.textContent;
          var ok=function(){b.textContent='הועתק ✓';b.classList.add('copied');setTimeout(function(){b.textContent=o;b.classList.remove('copied')},1800)};
          var fail=function(){var s=row.querySelector('.d');s.textContent=t;s.style.userSelect='all';var r=document.createRange();r.selectNodeContents(s);var sel=getSelection();sel.removeAllRanges();sel.addRange(r)};
          if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fail)}else{fail()}
        });
        list.appendChild(row);
      });
      sec.appendChild(list);out.appendChild(sec);
    });
  }
  document.querySelectorAll('.filters button').forEach(function(b){
    b.addEventListener('click',function(){
      filter=b.getAttribute('data-f');
      document.querySelectorAll('.filters button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
      render();
    });
  });
  render();
})();
</script>
</body>
</html>
