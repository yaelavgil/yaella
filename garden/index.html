<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#1f2a1f; --muted:#5d6b5a; --card:rgba(252,250,244,.88); --line:#dcd8c8;
  --leaf:#4f9a45; --leaf-d:#3a7a34; --sun:#f4c032; --terra:#d9784f; --bad:#c4553a;
  color-scheme:light;
}
html,body{margin:0;height:100%}
body{font-family:'Varela Round',system-ui,sans-serif;color:var(--ink);background:#2e4a2b;overflow-x:hidden;
  min-height:100dvh;display:flex;justify-content:center}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(20,40,20,.35),rgba(20,40,20,.55));transition:opacity 1.2s}
body.watch .shade{opacity:0}
#end{transition:opacity .9s,transform .9s}
#end.out{opacity:0;transform:translateY(24px);pointer-events:none}
#dock{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;
  animation:dockIn .6s ease-out}
#dock button{background:rgba(20,35,20,.6);color:#fff;font-size:15px;padding:10px 16px;backdrop-filter:blur(6px);white-space:nowrap}
@media (max-width:600px){#dock{left:auto;right:14px;transform:none;animation:none}}
@keyframes dockIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.watchbtn{display:block;margin:10px auto 0;background:none;color:var(--muted);font-size:15px;padding:6px 10px;text-decoration:underline}
main{position:relative;z-index:2;width:100%;max-width:520px;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 76px);
  display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:26px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.28);backdrop-filter:blur(6px)}
h1,h2,.big{font-family:'Secular One','Varela Round',sans-serif;font-weight:400;margin:0}
h1{font-size:clamp(34px,10vw,46px);line-height:1.05}
p{margin:0;line-height:1.55}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 20px;font-size:17px;transition:transform .12s}
button:active{transform:scale(.96)}
.primary{background:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-d)}
.ghost{background:#efeadb;color:var(--ink)}
.sunny{background:var(--sun);color:#3b2d00}

/* start */
#start{margin-top:auto;margin-bottom:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
#start img.mascot{width:130px;animation:sway 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
#start .go{font-size:20px;padding:15px 34px;margin-top:6px}

/* game */
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.4);display:block}
.dots i.now{background:#fff}
.dots i.ok{background:var(--sun)}
.dots i.miss{background:#e9a48f}
.score{font-family:'Secular One';font-size:18px}
.photo{position:relative;border-radius:18px;overflow:hidden;background:#cfd8c6;aspect-ratio:3/4;height:min(46dvh,calc((100vw - 72px)*4/3));max-width:100%;margin:0 auto;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.photo .num{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:4px 12px;font-size:14px}
.photo .zoom{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
form{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;font:inherit;font-size:18px;padding:13px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--leaf)}
.fb{margin-top:12px;min-height:0}
.msg{font-size:18px;text-align:center;padding:4px 0 10px}
.msg.bad{color:var(--bad)}
.msg.warm{color:#b07a00}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hint{background:#fff6d8;border:1px dashed #e0bf52;border-radius:16px;padding:10px 14px;margin-top:10px;font-size:16px}
.reveal{text-align:center;padding-top:4px}
.reveal .big{font-size:40px;color:var(--leaf-d)}
.reveal .sci{font-size:14px;color:var(--muted);direction:ltr;font-style:italic}
.reveal p{margin:8px 0 14px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* end */
#end{text-align:center;position:relative}
.x{position:absolute;top:12px;left:12px;width:38px;height:38px;padding:0;border-radius:50%;background:#efeadb;color:var(--ink);font-size:18px;line-height:38px}
.trophy{background:rgba(0,0,0,.4);color:#fff;font-size:15px;padding:7px 12px}
.toplinks{margin-top:4px;background:none;color:var(--leaf-d);font-size:16px;padding:6px 10px;text-decoration:underline}
#mBoard{position:fixed;inset:0;z-index:7;background:rgba(15,30,15,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#mBoard .card{width:100%;max-width:460px;max-height:86dvh;overflow:auto;position:relative}
#end .big{font-size:56px;color:var(--leaf-d);line-height:1}
.list{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0}
.list figure{margin:0}
.list img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.list figcaption{font-size:12px;margin-top:3px}

.board{margin:6px 0 18px;text-align:right}
.board h2{font-size:24px;text-align:center;margin-bottom:8px}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 14px;border:1px solid var(--line)}
.board li.me{background:#fff6d8;border-color:#e0bf52}
.board .pos{width:28px;text-align:center;font-family:'Secular One'}
.board .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pt{font-family:'Secular One';direction:ltr}
.join{display:flex;gap:8px;margin-top:10px}
#snd{position:fixed;z-index:5;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;width:44px;height:44px;padding:0;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;font-size:20px}
#lb{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%}
.leaf{position:fixed;z-index:8;top:-40px;font-size:28px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<video id="bg" src="media/garden.mp4" poster="media/poster.jpg" muted loop playsinline autoplay preload="auto"></video>
<div class="shade"></div>
<audio id="amb" src="media/nature.m4a" loop preload="auto"></audio>
<button id="snd" type="button" aria-label="צליל" hidden>🔊</button>
<div id="dock" hidden><button type="button" id="dAgain">🔁 סיבוב נוסף</button><button type="button" id="dBoard">🏆 טבלת הניקוד</button></div>

<main>
  <section id="start" class="card">
    <img class="mascot" src="img/sprout.png" alt="">
    <h1>איזה עץ זה?</h1>
    <p>הגינה שלנו בהקמה, והעצים כבר כאן.<br>חמישה עצים, חמש תמונות. מנחשים, ואם נתקעים יש רמזים.</p>
    <p class="muted">במיוחד לאביבה, הבוטנאית של המשפחה 🌿</p>
    <input id="pname" maxlength="24" placeholder="איך קוראים לך? (לטבלת הניקוד)" aria-label="השם שלך לטבלת הניקוד" autocomplete="given-name" style="width:100%;max-width:300px;text-align:center">
    <button class="primary go" type="button" id="goBtn">יאללה, מתחילים</button>
    <button class="toplinks" type="button" data-board>🏆 לטבלת הניקוד</button>
  </section>

  <div id="game" hidden>
    <div class="top"><div class="dots" id="dots"></div><div style="display:flex;align-items:center;gap:10px"><div class="score" id="score">0 נק׳</div><button class="trophy" type="button" data-board aria-label="טבלת הניקוד">🏆 טבלה</button><button class="trophy" type="button" id="exitBtn" aria-label="יציאה מהמשחק">✕ יציאה</button></div></div>
    <section class="card" id="play">
      <div class="photo" id="photo"><img id="pic" alt="עץ מהגינה"><span class="num" id="num"></span><span class="zoom">🔍 הגדלה</span></div>
      <div id="ask">
        <form id="f" autocomplete="off">
          <input id="guess" placeholder="מה העץ הזה?" aria-label="הניחוש שלך" enterkeyhint="done">
          <button class="primary" type="submit">בדיקה</button>
        </form>
        <div class="fb" id="fb"></div>
      </div>
      <div class="reveal" id="rev" hidden></div>
    </section>
  </div>

  <section id="end" class="card" hidden></section>
</main>

<div id="lb" hidden><img alt=""></div>
<div id="mBoard" hidden><section class="card board"><button class="x" type="button" id="mClose" aria-label="סגירה">✕</button>
  <h2>🏆 טבלת הניקוד</h2><div id="mList" class="muted" style="text-align:center">טוען...</div>
  <p class="muted" style="text-align:center;margin-top:12px;font-size:14px" id="mNote"></p>
  <div style="text-align:center;margin-top:10px"><button class="ghost" type="button" id="mExit" hidden>יציאה מהמשחק 🌿</button></div></section></div>

<script>
// ---- the trees: edit names / hints here ----
var TREES = [
  {img:'img/tree1.jpg', name:"ליצ'י", sci:'Litchi chinensis',
   ok:["ליצי","ליצ'י","ליצ׳י","litchi","lychee","lichi"],
   warm:{words:["לונגן","רמבוטן"], say:'ממש קרוב! אותה משפחה בדיוק, אבל לא.'},
   hints:['עץ טרופי. הפרי שלו מבשיל אצלנו בתחילת הקיץ, ביוני־יולי.','פרי אדום עם קליפה מחוספסת, ובפנים ציפה לבנה ושקופה.'],
   fact:'מקורו בדרום סין, ושם הוא מגודל כבר אלפי שנים. עוד כמה שנים: ליצ\'י מהגינה!'},
  {img:'img/tree2.jpg', name:'שקדייה', sci:'Prunus dulcis',
   ok:["שקד","שקדיה","שקדייה","שקדים","almond"],
   warm:{words:["אפרסק","נקטרינה","שזיף","משמש","דובדבן"], say:'חם חם! מאותה משפחה בדיוק, אבל לא הוא.'},
   hints:['הוא הראשון לפרוח, עוד בסוף החורף, וכל ילד בגן שר עליו.','מהפרי שלו אוכלים בעצם את הגרעין.'],
   fact:'קרוב משפחה של האפרסק, ומעצי הפרי הראשונים שבויתו באזור שלנו. ובט״ו בשבט: "השקדייה פורחת" בחצר שלנו.'},
  {img:'img/tree3.jpg', name:'מנגו', sci:'Mangifera indica',
   ok:["מנגו","mango"],
   warm:{words:["ליצי","אבוקדו"], say:'כמעט! גם הוא טרופי, אבל לא.'},
   hints:['העלים הצעירים שלו יוצאים בצבע אדמדם־ברונזה ורק אחר כך מוריקים.','הפרי כתום, מתוק ומלכלך את הסנטר.'],
   fact:'קרוב משפחה של הפיסטוק ושל הקשיו. בעוד כמה שנים: מנגו מהעץ, ישר לקינוח.'},
  {img:'img/tree4.jpg', name:'תפוז', sci:'Citrus sinensis',
   ok:["תפוז","orange"],
   warm:{words:["הדר","קלמנטינה","מנדרינה","לימון","אשכולית","פומלה","פומלית","ליים","קומקוואט","תפוזינה"], say:'חם! זה הדר, אבל לא הזה.'},
   hints:['הדר, כן. עכשיו רק צריך לדעת איזה.','השם שלו בעברית הוא קיצור של "תפוח זהב".'],
   fact:'תפוז = תפוח זהב. ובאביב, כשהוא פורח, כל החצר תריח.'},
  {img:'img/tree5.jpg', name:'פומלה', sci:'Citrus maxima',
   ok:["פומלה","פומלו","פומלות","pomelo","pummelo"],
   warm:{words:["פומלית","אשכולית","הדר","תפוז","קלמנטינה","מנדרינה","לימון","ליים","קומקוואט","תפוזינה"], say:'חם! זה הדר, אבל לא הזה.'},
   hints:['הדר עם עלים גדולים ורחבים במיוחד.','הפרי שלו הכי גדול במשפחת ההדרים, לפעמים בגודל של כדור.'],
   fact:'מהאבות המייסדים של משפחת ההדרים: האשכולית נולדה מהכלאה של פומלה ותפוז. והפרי? הכי גדול מכולם.'}
];

var lastMsg='';
var NOPE = ['לא... 🙂','ממש לא, אבל ניסיון יפה','אוי, לא','לא זה. העץ קצת נעלב 🌳','לא, אבל אהבנו את האומץ'];
var $ = function(id){return document.getElementById(id)};
var i = 0, tries = 0, hintsUsed = 0, total = 0, results = [];

// ---- sound / video ----
var amb = $('amb'), snd = $('snd'), bg = $('bg'), soundOn = true;
function startMedia(){
  bg.play().catch(function(){});
  amb.volume = 0.7;
  amb.play().then(function(){snd.hidden=false}).catch(function(){snd.hidden=false;soundOn=false;snd.textContent='🔇'});
}
snd.addEventListener('click',function(){
  soundOn=!soundOn; snd.textContent=soundOn?'🔊':'🔇';
  if(soundOn){amb.play().catch(function(){})}else{amb.pause()}
});

// ---- matching ----
function norm(s){
  return s.toLowerCase().replace(/[\s'"`׳״\-.,!?]/g,'')
    .replace(/ך/g,'כ').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ף/g,'פ').replace(/ץ/g,'צ')
    .replace(/^עצ(ה)?/,'').replace(/^ה(?=.{3,})/,'');
}
function lev(a,b){
  var m=[],x,y;for(x=0;x<=a.length;x++){m[x]=[x]}for(y=0;y<=b.length;y++){m[0][y]=y}
  for(x=1;x<=a.length;x++)for(y=1;y<=b.length;y++)m[x][y]=Math.min(m[x-1][y]+1,m[x][y-1]+1,m[x-1][y-1]+(a[x-1]===b[y-1]?0:1));
  return m[a.length][b.length];
}
function hits(g,list){
  var n=norm(g);
  return list.some(function(w){var k=norm(w);return n===k||(k.length>=4&&lev(n,k)<=1)||(n.length>=4&&n.indexOf(k)>=0&&k.length>=3)});
}

// ---- flow ----
function dots(){
  $('dots').innerHTML=TREES.map(function(_,k){
    var c=results[k]?(results[k].pts>0?'ok':'miss'):(k===i?'now':'');return '<i class="'+c+'"></i>'}).join('');
  $('score').textContent=total+' נק׳';
}
function show(){
  var t=TREES[i]; tries=0; hintsUsed=0;
  $('pic').src=t.img; $('num').textContent='עץ '+(i+1)+' מתוך '+TREES.length;
  $('ask').hidden=false; $('rev').hidden=true; $('fb').innerHTML=''; $('guess').value='';
  dots();
  if(i+1<TREES.length){var pre=new Image();pre.src=TREES[i+1].img}
}
function feedback(html){$('fb').innerHTML=html}
function actions(){
  var t=TREES[i], more=hintsUsed<t.hints.length;
  return '<div class="acts">'+
    '<button type="button" class="ghost" data-a="retry">לנסות שוב</button>'+
    (more?'<button type="button" class="sunny" data-a="hint">רמז 💡</button>':'')+
    '<button type="button" class="ghost" data-a="show">תראו לי</button></div>'+hintsHtml();
}
function hintsHtml(){
  return TREES[i].hints.slice(0,hintsUsed).map(function(x,k){return '<div class="hint">💡 רמז '+(k+1)+': '+x+'</div>'}).join('');
}
$('f').addEventListener('submit',function(e){
  e.preventDefault();
  var g=$('guess').value.trim(); if(!g){$('guess').focus();return}
  var t=TREES[i]; tries++;
  if(hits(g,t.ok)){ return win(); }
  var warm=t.warm&&hits(g,t.warm.words);
  var m=warm?t.warm.say:NOPE[(tries-1)%NOPE.length];
  lastMsg='<div class="msg '+(warm?'warm':'bad')+'">'+m+'</div>';
  feedback(lastMsg+actions());
  $('play').classList.remove('shake'); void $('play').offsetWidth; $('play').classList.add('shake');
  $('guess').blur();
});
$('fb').addEventListener('click',function(e){
  var a=e.target.getAttribute('data-a'); if(!a)return;
  if(a==='retry'){feedback(hintsHtml());$('guess').value='';$('guess').focus()}
  if(a==='hint'){hintsUsed++;feedback(lastMsg+actions())}
  if(a==='show'){reveal(0,false)}
});
function win(){
  var pts=Math.max(1,3-hintsUsed-(tries>1?1:0));
  confetti(); reveal(pts,true);
}
function reveal(pts,won){
  var t=TREES[i]; total+=pts; results[i]={pts:pts,won:won};
  $('ask').hidden=true; var r=$('rev'); r.hidden=false;
  var head=won?(tries===1&&!hintsUsed?'בול! על הפעם הראשונה 🎉':'נכון! 🎉'):'זה היה...';
  r.innerHTML='<p class="muted" style="margin:0 0 4px">'+head+'</p><div class="big">'+t.name+'</div>'+
    '<div class="sci">'+t.sci+'</div><p>'+t.fact+'</p>'+
    (won?'<p class="muted" style="margin-top:-6px">+'+pts+' נק׳</p>':'')+
    '<button class="primary" type="button" id="next">'+(i+1<TREES.length?'לעץ הבא ←':'לתוצאות 🌳')+'</button>';
  $('next').addEventListener('click',function(){i++; if(i<TREES.length){show()}else{end()} window.scrollTo({top:0,behavior:'smooth'})});
  dots();
}
function end(){
  $('game').hidden=true; var e=$('end'); e.hidden=false;
  var max=TREES.length*3, n=results.filter(function(r){return r.won}).length;
  var aviva=/אביב/.test(player);
  var title = total>=13?(aviva?'אביבה, את רשמית האגרונומית של המשפחה 👩‍🌾':(player?player+', ':'')+'ציון של אגרונומים מוסמכים 🧑‍🌾'):
              total>=9 ?'יש לך עין ירוקה! כמעט מושלם 🌿':
              total>=5 ?'לא רע בכלל. עוד שנה, כשיהיו פירות, יהיה קל יותר 🍊':
                        'מבטיחים שכשיהיו פירות, זה יהיה קל יותר 😄';
  e.innerHTML='<button class="x" type="button" id="endX" aria-label="סגירה">✕</button><img src="img/sprout.png" alt="" style="width:90px">'+
    '<div class="big"><bdi dir="ltr">'+total+'<span style="font-size:24px"> / '+max+'</span></bdi></div>'+
    '<p style="font-size:19px;margin:6px 0 2px">'+title+'</p><p class="muted">'+n+' מתוך '+TREES.length+' עצים בלי לראות את התשובה</p>'+
    '<div class="list">'+TREES.map(function(t,k){return '<figure><img src="'+t.img+'" alt=""><figcaption>'+(results[k].won?'✅ ':'')+t.name+'</figcaption></figure>'}).join('')+'</div>'+
    '<div class="board" id="board"><h2>🏆 טבלת הניקוד</h2><div id="boardList" class="muted" style="text-align:center">טוען...</div>'+
      (player?'':'<form class="join" id="joinF"><input id="joinName" maxlength="24" placeholder="השם שלך" aria-label="השם שלך"><button class="primary" type="submit">להיכנס לטבלה</button></form>')+'</div>'+
    '<p class="muted" style="margin-bottom:14px">ניפגש בגינה כשהכל יהיה שתול 💚<br>יעל ורועי</p>'+
    '<button class="ghost" type="button" id="again">עוד סיבוב</button>'+
    '<button class="watchbtn" type="button" id="watchBtn">לצפות בגינה ▶</button>';
  $('again').addEventListener('click',restart);
  $('watchBtn').addEventListener('click',watch);
  $('endX').addEventListener('click',watch);
  scheduleWatch(10000);
  var jn=$('joinName'); if(jn)jn.addEventListener('focus',function(){clearTimeout(watchT)});
  var jf=$('joinF');
  if(jf)jf.addEventListener('submit',function(ev){ev.preventDefault();var v=$('joinName').value.trim();if(!v)return;setPlayer(v);jf.remove();saveScore(total,max);scheduleWatch(7000)});
  if(player){saveScore(total,max)}else{loadBoard()}
}

// ---- leaderboard (shared Firebase RTDB, best score per name) ----
var DB='https://home-picks-47450-default-rtdb.europe-west1.firebasedatabase.app/garden_scores';
var player='';
try{player=localStorage.getItem('gardenName')||''}catch(e){}
if(player)$('pname').value=player;
function setPlayer(v){player=v.slice(0,24);try{localStorage.setItem('gardenName',player)}catch(e){}}
function keyOf(n){return n.trim().toLowerCase().replace(/[.#$\[\]\/\s]+/g,'_').slice(0,40)||'_'}
function isTest(n){return /^\s*(test|טסט|טעסט|בדיקה)/i.test(n||'')}
function saveScore(sc,max){
  if(!player||isTest(player)){return loadBoard()}
  var k=keyOf(player), url=DB+'/'+encodeURIComponent(k)+'.json';
  fetch(url).then(function(r){return r.json()}).then(function(old){
    var rec={name:player,score:sc,max:max,plays:((old&&old.plays)||0)+1,ts:Date.now()};
    if(old&&old.score>sc){rec.score=old.score;rec.ts=old.ts;rec.last=sc}
    return fetch(url,{method:'PUT',body:JSON.stringify(rec)});
  }).catch(function(){}).then(function(){loadBoard(k)});
}
function loadBoard(meKey,target){
  var tid=target||'boardList';
  meKey=meKey||(player?keyOf(player):'');
  fetch(DB+'.json').then(function(r){return r.json()}).then(function(d){
    var rows=Object.keys(d||{}).filter(function(k){return !isTest((d[k]||{}).name)}).map(function(k){var x=d[k]||{};return {k:k,name:String(x.name||'?'),score:+x.score||0,ts:+x.ts||0}})
      .sort(function(a,b){return b.score-a.score||a.ts-b.ts});
    var box=$(tid); if(!box)return;
    if(!rows.length){box.textContent='עדיין אין אף אחד בטבלה. את/ה הראשון/ה!';return}
    var ol=document.createElement('ol'), medal=['🥇','🥈','🥉'];
    rows.slice(0,30).forEach(function(r,idx){
      var li=document.createElement('li'); if(r.k===meKey)li.className='me';
      li.innerHTML='<span class="pos"></span><span class="nm"></span><span class="pt"></span>';
      li.querySelector('.pos').textContent=medal[idx]||(idx+1);
      li.querySelector('.nm').textContent=r.name;
      li.querySelector('.pt').textContent=r.score+' / 15';
      ol.appendChild(li);
    });
    box.className='';box.innerHTML='';box.appendChild(ol);
  }).catch(function(){var b=$(tid);if(b)b.textContent='לא הצלחנו לטעון את הטבלה כרגע'});
}
// ---- after the game: fade the card away and leave the garden video looping ----
var watchT=0;
function scheduleWatch(ms){clearTimeout(watchT);watchT=setTimeout(watch,ms)}
function watch(){
  clearTimeout(watchT); var e=$('end'); e.classList.add('out'); document.body.classList.add('watch');
  setTimeout(function(){if(e.classList.contains('out')){e.hidden=true;$('dock').hidden=false}},900);
  bg.play().catch(function(){});
}
function unwatch(){document.body.classList.remove('watch');$('dock').hidden=true;var e=$('end');e.classList.remove('out')}
function restart(){clearTimeout(watchT);unwatch();bg.play().catch(function(){});i=0;total=0;results=[];$('end').hidden=true;$('game').hidden=false;show();window.scrollTo(0,0)}
$('dAgain').addEventListener('click',restart);
function openBoard(){
  $('mBoard').hidden=false; $('mList').className='muted'; $('mList').textContent='טוען...';
  var playing=!$('game').hidden;
  $('mExit').hidden=!playing;
  $('mNote').textContent=playing?'המשחק מחכה לך. סוגרים ב־✕ וממשיכים מאיפה שעצרת.':'';
  loadBoard(null,'mList');
}
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('[data-board]'))openBoard()});
function exitGame(){
  $('mBoard').hidden=true; $('lb').hidden=true; $('game').hidden=true; $('start').hidden=true;
  document.body.classList.add('watch'); $('dock').hidden=false; bg.play().catch(function(){});
}
$('mExit').addEventListener('click',exitGame);
$('exitBtn').addEventListener('click',exitGame);
$('mClose').addEventListener('click',function(){$('mBoard').hidden=true});
$('mBoard').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
$('dBoard').addEventListener('click',openBoard);

function confetti(){
  var L=['🍃','🌿','🍀','🌱','🍊'];
  for(var k=0;k<22;k++){var s=document.createElement('span');s.className='leaf';s.textContent=L[k%L.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.8+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(s);setTimeout(function(x){return function(){x.remove()}}(s),4000)}
}
// lightbox
$('photo').addEventListener('click',function(){var lb=$('lb');lb.querySelector('img').src=TREES[i].img;lb.hidden=false});
$('lb').addEventListener('click',function(){this.hidden=true});

$('goBtn').addEventListener('click',function(){
  var v=$('pname').value.trim(); if(v)setPlayer(v);
  startMedia(); $('start').hidden=true; $('game').hidden=false; show();
});
</script>
