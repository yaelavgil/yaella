/* Layout: sticky header (title, ballot chip, search) + hotline strip, tab bar, one column of cards; bottom-safe spacing for thumbs */
:root{
  --bg:#f4f7fb; --surface:#ffffff; --ink:#0f1a33; --muted:#56627d; --line:#dbe3ef;
  --navy:#16306e; --accent:#2f7fd1; --accent-soft:#e3effb; --warn:#a4570c; --warn-soft:#fdf1e4;
  --quote:#eef4fb; --chip:#ffffff;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1323; --surface:#152039; --ink:#e7edf8; --muted:#9eabc4; --line:#26355a;

:root[data-theme="dark"]{
  --bg:#0c1323; --surface:#152039; --ink:#e7edf8; --muted:#9eabc4; --line:#26355a;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;direction:rtl}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;color:var(--navy);letter-spacing:.2px}
.ballot{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.slip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:62px;aspect-ratio:5/7;max-width:100%;background:linear-gradient(135deg,#ffffff 0%,#f6f6f4 55%,#e9e9e6 100%);color:#000;border-radius:1px 1px 6px 1px;padding:6px 4px;box-shadow:0 1px 1px rgba(0,0,0,.12),2px 4px 9px rgba(0,0,0,.22);flex:0 0 auto}
.slip::after{content:"";position:absolute;inset:auto 0 0 auto;width:12px;height:12px;background:linear-gradient(225deg,transparent 50%,rgba(0,0,0,.08) 50%,#dcdcd8 60%,#f4f4f2 100%);border-bottom-right-radius:6px}
.slip .letters{font-family:"Frank Ruhl Libre","David Libre","Times New Roman",serif;font-weight:900;font-size:1.7rem;line-height:.95;letter-spacing:-.5px}
.slip .name{font-family:"Frank Ruhl Libre","Times New Roman",serif;font-weight:700;font-size:.42rem;line-height:1.2;text-align:center}
.search{margin-top:10px;position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.hot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.88rem;color:var(--muted)}
.hot b{color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
nav{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:inherit;font-weight:600;font-size:.95rem;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lead{color:var(--muted);font-size:.95rem;margin:14px 2px 6px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;gap:10px;align-items:flex-start}
.card>summary::-webkit-details-marker{display:none}
.card>summary .t{font-weight:700;font-size:1.02rem;flex:1;min-width:0;text-wrap:balance}
.card>summary .sec{font-size:.72rem;color:var(--muted);letter-spacing:.3px;white-space:nowrap;margin-top:3px}
.card>summary::after{content:"+";font-weight:700;color:var(--accent);font-size:1.2rem;line-height:1}
.card[open]>summary::after{content:"–"}
.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.body p{margin:0}
.body ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.say{background:var(--quote);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.say .lbl{font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.4px}
.say q{quotes:none;font-weight:600}
.warn{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:.93rem}
.warn b{color:var(--warn)}
.src{display:flex;flex-wrap:wrap;gap:6px}
.src a{font-size:.82rem;text-decoration:none;background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.copy{align-self:flex-start;font:inherit;font-size:.82rem;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:4px 10px;cursor:pointer}
.person summary{align-items:center}
.person img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--line)}
.num{font-family:var(--display);color:var(--navy);font-size:1.05rem;min-width:1.6em;text-align:center}
.role{display:block;font-weight:400;color:var(--muted);font-size:.86rem}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
th,td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.faces{display:flex;flex-wrap:wrap;gap:8px}
.face{display:flex;align-items:center;gap:6px;background:var(--accent-soft);border-radius:999px;padding:3px 10px 3px 3px;font-size:.82rem;font-weight:600}
.face img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.ptable{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.ptable table{min-width:560px}
.ptable td{font-size:.86rem;line-height:1.45}
.ptable .who{display:flex;align-items:center;gap:8px;font-weight:700;min-width:130px}
.ptable .who img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.ptable .who small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.subhead{font-family:var(--display);font-weight:400;color:var(--navy);font-size:1.15rem;margin:18px 2px 0}
.hero{margin-inline:-16px;background:#7cc8f5;line-height:0}
.hero img{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;object-position:center top}
@media (min-width:760px){.hero{margin-inline:0;border-radius:0 0 16px 16px;overflow:hidden}}
header{border-bottom:3px solid #7cc8f5!important}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.foot{color:var(--muted);font-size:.8rem;margin-top:22px;text-align:center}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card[open]{border-color:var(--accent)}}
</style>

 {t:"הפיץ׳ של 30 שניות", b:`<p>פתיחה לכל שיחה.</p>`, say:`הם היו פה בשבילנו מ-7 באוקטובר, בלי תפקיד ובלי כוח. סגן רמטכ"ל שנסע לנובה ברכב שלו, מילואימניקים עם מאות ימי מילואים, אנשים שפתחו חמ"לים כשהמדינה לא תפקדה ונאבקו על החטופים. תחשוב מה הם יעשו כשיהיה להם כוח. שימו אמת בקלפי.`, src:[]},
 {t:"אנשים מנוסים ואחראים", who:[1, 11, 3, 4, 2], b:`<ul><li>גולן: סגן הרמטכ"ל, אלוף פיקוד הצפון ופיקוד העורף, סגן שר הכלכלה.</li><li>שפר: ראש אגף התכנון בצה"ל, ראש מטה חיל האוויר, מנכ"ל התעשייה האווירית.</li><li>7 מ-15 הראשונים כיהנו בכנסת. 3 עמדו בראש ועדות: החוקה (קריב), העבודה והרווחה (רייטן), הצעירים (לזימי).</li></ul>`, say:`זו לא קבוצה של מתחילים. הם כבר ניהלו צבא, תעשייה וועדות כנסת, ויודעים לקחת אחריות.`, src:[S("ויקיפדיה: גולן","https://he.wikipedia.org/wiki/%D7%99%D7%90%D7%99%D7%A8_%D7%92%D7%95%D7%9C%D7%9F"),S("ויקיפדיה: שפר","https://he.wikipedia.org/wiki/%D7%A0%D7%9E%D7%A8%D7%95%D7%93_%D7%A9%D7%A4%D7%A8")]},
 {t:"אנשים שהיו שם", who:[1, 7, 13, 12, 14], b:`<ul><li>גולן נסע לנובה ב-7.10 וחילץ צעירים.</li><li>עמרי רונן לחם בעוטף מהבוקר ועשה יותר מ-300 ימי מילואים. סבתו נרצחה בכפר עזה.</li><li>אבי דבוש שרד את הטבח בנירים וחזר לגור בעוטף.</li><li>מורן זר קצנשטיין פתחה חמ"ל למפונים בצהרי 7.10.</li><li>אמילי מואטי הובילה את המאבק הבינלאומי על החטופים.</li></ul>`, say:`הם לא מדברים על ביטחון מהאולפן. הם היו שם, והם לא יערקו.`, src:[S("וואלה: החילוץ","https://www.walla.co.il/news/military/3614701"),S("N12: רונן","https://www.mako.co.il/news-politics/2026_q3/Article-a7914c8753a7f91027.htm"),S("זמן ישראל: דבוש","https://www.zman.co.il/677735/")]},
 {t:"אנשי עשייה בשטח", who:[9, 6, 2, 3, 12, 7], b:`<ul><li>עמדו עם מגפונים מול המכת"זיות (רדמן, לסקי).</li><li>יצאו לרחובות למען החטופים (לזימי, קריב).</li><li>הקימו את "בונות אלטרנטיבה" ודאגו לתצפיתניות (זר קצנשטיין).</li><li>החמ"ל של אחים לנשק: כ-15 אלף מתנדבים ביום וכ-2,000 משפחות ששוכנו.</li></ul>`, say:`בימים הראשונים, כשהמדינה לא תפקדה, הם קמו ועשו.`, src:[S("Boston Globe / NYT","https://www.bostonglobe.com/2023/10/29/world/they-refused-serve-now-theyre-supporting-israels-war-effort"),S("מאקו: זר קצנשטיין","https://www.mako.co.il/news-israel-elections/2026/Article-cc978d99471fd91026.htm")]},
 {t:"אין עריקים", b:`<p>סילמן ושיקלי מימינה עזבו את ממשלת השינוי, וקיבלו תיקים בממשלת נתניהו. את רשימת הדמוקרטים בחרו כ-97 אלף מתפקדים, מתוך יותר מ-110 אלף.</p>`, say:`אף אחד לא יקנה אותם בג'וב או בתיק. אצלנו אין עריקים.`, src:[S("Al-Monitor: סילמן","https://www.al-monitor.com/originals/2022/04/israels-bennett-loses-majority-after-mp-quits-coalition"),S("ynet: שיקלי","https://ynetnews.com/article/rjgtmvrhq"),S("ynet: הפריימריז","https://www.ynetnews.com/article/synmdasnzx")]},
 {t:"העוגן הבטוח נגד נתניהו", who:[1], b:`<p>בנט הציע שנתניהו יוכל לשבת בממשלה, ואחר כך חזר בו. ליברמן מאשים את איזנקוט שהוא מתכנן ממשלה עם נתניהו. גולן: ממשלה עם נתניהו "לא תקרה איתי".</p>`, say:`רוצה לדעת בוודאות שהקול שלך לא יגיע לנתניהו? יש רק כתובת אחת שאפשר להיות בטוחים בה.`, src:[S("ToI: בנט","https://www.timesofisrael.com/bennett-suggests-netanyahu-could-be-part-of-future-government-quickly-backtracks/"),S("ToI: ליברמן","https://www.timesofisrael.com/liberman-accuses-eisenkot-of-seeking-to-form-unity-government-with-likud-hes-gantz-2/"),S("ToI: גולן","https://www.timesofisrael.com/liveblog_entry/yair-golan-accuses-netanyahu-of-planning-to-disrupt-october-27-election/")]},
 {t:"הגוש קובע, לא המפלגה הגדולה", b:`<p>ב-2009 קדימה קיבלה 28 מנדטים, ונתניהו הקים ממשלה עם 27. ב-2021 הליכוד קיבל 30, ובנט הקים ממשלה עם 7. לדמוקרטים יש הסכם עודפים עם "ישר!".</p>`, say:`השאלה היא לא מי הכי גדול, אלא מי השותפים. ואף קול לא הולך לאיבוד.`, src:[S("ויקיפדיה 2009","https://en.wikipedia.org/wiki/2009_Israeli_legislative_election"),S("ויקיפדיה 2021","https://en.wikipedia.org/wiki/2021_Israeli_legislative_election"),S("ynet: הסכם העודפים","https://www.ynet.co.il/news/elections2026/article/syswreefmx")]},
 {t:"כוח = התיקים החשובים", b:`<p>ליברמן כבר הודיע שלא ייתן לדמוקרטים את תיקי הביטחון, המשפטים וביטחון הפנים. גודל המפלגה יקבע אם יהיה להם כוח לבטל את חוקי ההפיכה, להקים ועדת חקירה ולטפל בפשיעה.</p><div class="warn"><b>זהירות:</b> אין נוסחה קבועה של תיקים לפי מנדטים. אמרי "יותר מנדטים = תיקים חשובים יותר".</div>`, say:`יש להם את הניסיון, את האנשים ואת הנאמנות. מה שחסר זה הכוח, וזה תלוי בך.`, src:[S("כיכר השבת: ליברמן","https://www.kikar.co.il/political-news/lieberman-red-line-democrats-security-justice")]},
 {t:"ועדת חקירה ממלכתית היא ההחלטה הראשונה", who:[1], b:`<p>במצע: "נקים ועדת חקירה ממלכתית לאירועי 7 באוקטובר וניישם את מסקנותיה במלואן". גולן: זו תהיה ההחלטה הראשונה של ממשלה בראשותו.</p>`, say:`שלוש שנים אחרי 7 באוקטובר עוד אין ועדת חקירה ממלכתית. מי שמפחד ממנה דואג לעצמו, לא לנו.`, src:[S("המצע",PLAN),S("N12","https://www.mako.co.il/news-politics/2026_q3/Article-56925b75e108f91027.htm")]},
 {t:"משפטים מהשטח", b:`<ul><li>"אלה הערכים שלי, זה המוסר שלי, והדמוקרטים מייצגים בדיוק את זה."</li><li>"אנשים חזקים גם ביטחונית וגם חברתית, וזה מה שחסר לי במדינה הזאת."</li><li>"הדברים שהם צועקים עליהם כל הזמן הם הדברים שכואבים לנו."</li><li>"אפשר לא להסכים איתו, אבל אי אפשר להגיד שהוא בוגד."</li><li>"התביעה שלנו למנהיגות לא נסמכת על אספירציות אישיות, אלא על מחויבות לציבור."</li></ul>`, say:`הם היו שם ונאבקו שוב ושוב, ואף פעם לא נכנעו. אחרי שהוכיחו את עצמם, אפשר לתת בהם אמון.`, src:[]},
]},

{id:"qa", label:"תשובות", lead:"הטענות שתשמעי בעמדה. בכל תשובה: מה נכון בטענה, העובדה, ומשפט לסיום.", items:[
 {t:`"גולן אמר שישראל הורגת תינוקות כתחביב"`, who:[1], tags:"גולן תינוקות תחביב צהל חיילים", b:`<p>הציטוט מ-20.5.2025, רשת ב': "מדינה שפויה לא מנהלת לחימה נגד אזרחים, לא הורגת תינוקות כתחביב, ולא שמה לעצמה מטרות של גירוש אוכלוסייה." הניסוח היה קשה, וזכה לגינויים רחבים. ארבעה ימים אחר כך: "בוודאי שישראל לא הורגת תינוקות כתחביב". לדבריו כיוון לשרים שדיברו על הרעבה וגירוש. הוא לא התנצל.</p>`, say:`אפשר לא לאהוב את המשפט. אבל מי שנסע לנובה ברכב שלו וחילץ צעירים לא חושב שחיילי צה"ל רוצחים.`, src:[S("JDN: הציטוט","https://www.jdn.co.il/news/2410745/"),S("N12: ההבהרה","https://www.mako.co.il/news-politics/2025_q2/Article-2f9ae3daa820791027.htm")]},
 {t:`"גולן בוגד" / "ידע מראש על 7.10"`, who:[1], tags:"גולן בוגד שרה נתניהו קונספירציה נובה", b:`<p>שרה נתניהו רמזה בערוץ 14 שגולן היה "מלובש ומוכן". עוז דוידיאן, שחילץ איתו בשטח, אמר ב-N12: "הוא הגיע בסביבות 11:30 לא לפני כן". גולן הגיש תביעת דיבה, והפיצוי ייתרם לניצולי הנובה. בעבר בית המשפט כבר חייב מפיצה אחרת של הקונספירציה להתנצל ולשלם.</p>`, say:`אפשר לא להסכים איתו. אבל אי אפשר להגיד שבן אדם שסיכן את חייו כל הקריירה שלו, ויצא לבד ב-7 באוקטובר, הוא בוגד.`, src:[S("N12: התיעוד","https://www.mako.co.il/news-politics/2026_q3/Article-2e7fb04383d50a1027.htm"),S("מעריב: התביעה","https://www.maariv.co.il/news/law/article-1365046")]},
 {t:`"גולן רוצה לסגור את ערוץ 14"`, who:[1], tags:"ערוץ 14 תקשורת סגירה דמוקרטיה", b:`<p>אמר בפודקאסט של ynet בסוף דצמבר 2025: "כאשר אנחנו נעלה לשלטון, אנחנו נסגור את ערוץ 14". כעבור ימים הבהיר שהכוונה להפוך אותו "לערוץ תקשורת אמיתי". במצע אין סגירת ערוצים.</p>`, say:`זו הייתה אמירה מיותרת, והוא תיקן אותה. במצע אין סגירת ערוצים, ויש בו עיגון של חופש הביטוי בחוק יסוד.`, src:[S("ICE: הציטוט","https://www.ice.co.il/media/news/article/1098068"),S("ICE: ההבהרה","https://www.ice.co.il/media/news/article/1098648")]},
 {t:`"גולן השווה אותנו לנאצים" (2016)`, who:[1], tags:"גולן שואה נאום תהליכים 2016", b:`<p>בנאום ערב יום השואה 2016 דיבר על "תהליכים מעוררי חלחלה" באירופה של שנות ה-30, שהוא מוצא להם עדות כאן. הוא לא השווה לשואה. צה"ל הבהיר זאת באותם ימים, ושר הביטחון יעלון מהליכוד גיבה אותו.</p>`, say:`הוא הזהיר מהקצנה. ביום השואה, קצין יהודי שואל מה לומדים מזה. זה לגיטימי.`, src:[S("mako","https://www.mako.co.il/news-military/security-q2_2016/Article-c0bea1177f99451004.htm"),S("וואלה","https://www.walla.co.il/news/politics/2959303")]},
 {t:`"גולן קרא למתנחלים תתי אדם"`, who:[1], tags:"גולן תתי אדם חומש מתנחלים", b:`<p>נאמר ב-6.1.2022 על פורעים מחומש שניפצו מצבות בברקה, לא על המתנחלים ולא על חווארה. עוד באותו יום אמר: "יכולתי לעשות שימוש בביטוי יותר מוצלח כמו פורעים שפלים".</p>`, say:`הוא דיבר על מי שניפץ קברים, והודה שהביטוי לא היה מוצלח.`, src:[S("mako","https://www.mako.co.il/news-politics/2022_q1/Article-4c4e287096e2e71026.htm"),S("מעריב: ההתנצלות","https://www.maariv.co.il/news/politics/Article-889766")]},
 {t:`"הם הסיתו לסרבנות ופירקו את צה"ל לפני 7.10"`, who:[7, 1], tags:"סרבנות אחים לנשק מילואים רונן גולן", b:`<p>נכון שב-2023 אלפי מילואימניקים הודיעו שישעו את ההתנדבות. ב-7.10 אחים לנשק קראו לכולם להתייצב, וההתייצבות עברה את ה-100%. בהמשך הקימו חמ"ל אזרחי ענק. עמרי רונן עשה יותר מ-300 ימי מילואים. גולן ב-2024: "אי ציות אזרחי זה למשל, אנחנו לא עושים מילואים". המשטרה הבהירה שלא נפתחה חקירה.</p>`, say:`ב-7 באוקטובר הם היו הראשונים בשטח. השאלה האמיתית היא מי מעביר עכשיו חוק השתמטות.`, src:[S("Boston Globe / NYT","https://www.bostonglobe.com/2023/10/29/world/they-refused-serve-now-theyre-supporting-israels-war-effort"),S("סרוגים: אין חקירה","https://www.srugim.co.il/999132")]},
 {t:`"אתם רוצים מדינה פלסטינית. זה פרס לחמאס"`, tags:"מדינה פלסטינית חמאס פרס שתי מדינות היפרדות", b:`<p>בספטמבר 2025 גולן התנגד להכרה הבינלאומית: אחרי 7.10, לדבר על מדינה פלסטינית עכשיו "הרסני". המצע בעברית מדבר על "מהלך מדיני אחראי… מבלי להתפשר על ביטחוננו". במסמך החזון באנגלית: היפרדות, מדינה מפורזת בעתיד, ושליטה ישראלית בגבול הירדן. במיתווים 55% תמכו בעסקת חבילה: מדינה מפורזת, החזרת החטופים, פירוק חמאס ונורמליזציה.</p>`, say:`הפרס האמיתי לחמאס הוא מדינה אחת עם מיליוני פלסטינים. עמי איילון, ראש שב"כ לשעבר: הסיוט של חמאס הוא שתי מדינות.`, src:[S("ToI: גולן","https://www.timesofisrael.com/liveblog_entry/democrats-chair-yair-golan-international-recognition-of-palestine-extremely-damaging-to-israel-at-this-time/"),S("המצע",PLAN),S("מסמך החזון",VISION),S("מיתווים","https://mitvim.org.il/wp-content/uploads/2025/09/Mitvim-Institute-%E2%80%93-The-Israeli-Foreign-Policy-Index-2025-%E2%80%93-Key-Findings-1.pdf"),S("New Statesman: איילון","https://www.newstatesman.com/the-weekend-interview/2024/04/ami-ayalon-interview-hamas-nightmare-two-state-solution")]},
 {t:`"מדינה מפורזת? איך זה בכלל יעבוד?"`, tags:"מפורזת גבול הירדן בקעה נתניהו בר אילן", b:`<p>רכיבים שחוזרים בכל התוכניות: בלי צבא, רק משטרה. בלי בריתות צבאיות. מרחב אווירי בשליטה ישראלית. צה"ל על גבול הירדן ועל המעברים. תחנות התרעה. חופש פעולה נגד טרור, כמו באזור A מאז 2002. וכל שלב מותנה בקודם. נתניהו בנאום בר-אילן (2009): "ללא צבא וללא שליטה במרחב האווירי… מדינה פלסטינית מפורזת". גם קלינטון (2000), אולמרט (2008) וטראמפ (2020) הציעו את זה.</p><p>למה דווקא גבול הירדן: אחרי ההתנתקות עזבנו את ציר פילדלפי, והנשק של חמאס הגיע במנהרות מסיני.</p>`, say:`יש להם משטרה בלי צבא, בלי טילים ובלי שמיים. צה"ל יושב על גבול הירדן. זה בדיוק מה שנתניהו הציע ב-2009.`, src:[S("מסמך החזון",VISION),S("ויקיפדיה: בר-אילן","https://he.wikipedia.org/wiki/%D7%A0%D7%90%D7%95%D7%9D_%D7%91%D7%A8-%D7%90%D7%99%D7%9C%D7%9F"),S("תוכנית טראמפ","https://en.wikipedia.org/wiki/Trump_peace_plan"),S("פילדלפי","https://en.wikipedia.org/wiki/Philadelphi_Route")]},
 {t:`"ההתנתקות הוכיחה שכל נסיגה מביאה טרור"`, tags:"התנתקות עזה נסיגה 2005", b:`<p>נכון שאחרי 2005 חמאס תפס את עזה. אבל ההתנתקות הייתה חד-צדדית, בלי הסכם ובלי שליטה בגבול, וביצעה אותה ממשלת שרון מהליכוד. "מפקדים למען ביטחון ישראל" מציעים את ההפך: היפרדות אזרחית יחד עם שליטה ביטחונית של צה"ל.</p>`, say:`אנחנו לא מציעים לחזור על ההתנתקות. אנחנו מציעים ללמוד ממנה.`, src:[S("ויקיפדיה","https://en.wikipedia.org/wiki/Israeli_disengagement_from_Gaza"),S("ynet: מפקדים","https://www.ynet.co.il/news/article/HJ0zEeo6w")]},
 {t:`"אין פרטנר. הרשות משלמת למחבלים"`, tags:"פרטנר רשות תשלומים מחבלים pay for slay", b:`<p>שתי הטענות רציניות. הרשות ביטלה רשמית את התשלומים לאסירים בפברואר 2025, אבל ארה"ב טוענת שהם נמשכים בשם אחר. "מפקדים למען ביטחון ישראל": עתיד ישראל "אינו מותנה בקיומו של פרטנר".</p>`, say:`נכון, ולכן כל התקדמות צריכה להיות מותנית בהפסקת תשלומים מאומתת. אבל ההיפרדות היא אינטרס שלנו, לא מתנה להם.`, src:[S("ויקיפדיה","https://en.wikipedia.org/wiki/Palestinian_Authority_Martyrs_Fund"),S("cis.org.il","https://cis.org.il/")]},
 {t:`"ומה אם סעודיה לא תבוא?"`, tags:"סעודיה נורמליזציה אזורי", b:`<p>בתוכנית סעודיה היא בונוס, לא תנאי. עצירת הסיפוח והשליטה בגבול עובדות בלעדיה. מול איראן מסמך החזון מציע סיכול מקדים ובריתות עם ארה"ב ואירופה. מצרים, ירדן ומדינות הסכמי אברהם כבר שותפות. לפי INSS, שינוי בעמדה הסעודית ידרוש כנראה "שינוי פוליטי בישראל".</p><div class="warn"><b>להודות:</b> בלי סעודיה זה איטי וקשה יותר, במיוחד במימון השיקום של עזה.</div>`, say:`שלום עם מצרים וירדן החזיק עשרות שנים בלי סעודיה. היא לא הבסיס, היא הקומה הבאה. ועם הממשלה הזאת היא בטוח לא תבוא.`, src:[S("ToI: עמדת סעודיה","https://www.timesofisrael.com/liveblog_entry/after-trump-call-saudi-source-says-no-normalization-with-israel-without-irreversible-pathway-to-palestinian-state/"),S("INSS","https://www.inss.org.il/publication/saudi-israel-2026/"),S("מסמך החזון",VISION)]},
 {t:`"איך בדיוק יסגרו את הזירות ויעצרו את איראן?"`, who:[1, 11], tags:"איראן גרעין לבנון עזה סוריה זירות ביטחון", b:`<p>מה כתוב במצע ("סוגרים זירות לחימה"):</p><ul><li><b>עזה:</b> פירוז, החלפת שלטון חמאס ואכיפה בסיוע אזורי ובינלאומי.</li><li><b>לבנון:</b> כוח בינלאומי, חיזוק צבא לבנון, הרחקת חיזבאללה והטילים, וחופש פעולה לישראל בהפרות.</li><li><b>סוריה:</b> הסדר ביטחוני.</li><li><b>איראן:</b> "ברית מתונים אזורית ועולמית", עם דיפלומטיה, סנקציות ומהלכים צבאיים.</li></ul><div class="warn"><b>לא לנחש פרטים:</b> אילו מדינות או מתי. גולן על איראן: "נכון לא לדון בזה בפומבי".</div>`, say:`אף מפלגה לא מפרסמת תוכנית מבצעית. אבל מי שכתב את זה היה סגן רמטכ"ל וראש אגף התכנון. ומה התוכנית של הממשלה? שנה אחרי הפסקת האש חמאס עדיין שם. "ניצחון מוחלט" זו סיסמה.`, src:[S("המצע",PLAN),S("N12: גולן על איראן","https://www.mako.co.il/news-politics/2026_q1/Article-dd6dcbe1bc5fb91026.htm"),S("ToI: עזה שנה אחרי","https://www.timesofisrael.com/one-year-into-ceasefire-vexed-gazans-say-theyre-still-living-like-war-never-ended/")]},
 {t:`"ומה המתנגדים לשתי מדינות מציעים?"`, tags:"סיפוח סמוטריץ הכרעה ניהול סכסוך צמצום", b:`<ul><li><b>ניהול הסכסוך</b> (נתניהו): 7.10 הוכיח שזה לא עובד.</li><li><b>צמצום הסכסוך</b> (גודמן, בנט): צעד טוב בדרך, אבל לא מחליט איפה הגבול.</li><li><b>סיפוח שטחי C</b> (בנט 2012): מאות מובלעות בלי גבול.</li><li><b>תוכנית ההכרעה</b> (סמוטריץ' 2017): ריבונות, והפלסטינים נשארים בלי זכויות פוליטיות או מהגרים.</li><li><b>הגירה "מרצון"</b> מעזה: אף מדינה לא הסכימה לקלוט.</li></ul><p>ביולי 2024 הכנסת החליטה 68–9 נגד מדינה פלסטינית.</p>`, say:`ומה התוכנית שלך ל-20 שנה? אם 3.4 מיליון פלסטינים מצביעים, אין רוב יהודי. אם לא, אין דמוקרטיה.`, src:[S("ערוץ 7: סמוטריץ'","https://www.israelnationalnews.com/News/News.aspx/208955"),S("Al Jazeera: הצבעת הכנסת","https://www.aljazeera.com/amp/news/2024/7/18/israels-knesset-votes-to-reject-palestinian-statehood"),S("מדד השלום","https://en-social-sciences.tau.ac.il/sites/socsci-english.tau.ac.il/files/media_server/social/peaceindex/2025-11.pdf")]},
 {t:`"תקימו ממשלה עם הערבים / רע"ם"`, tags:"רעם ערבים עבאס קואליציה סגלוביץ", b:`<p>גולן אומר בגלוי שרע"ם היא שותפה לגיטימית, כמו בממשלת בנט-לפיד. עבאס ב-2021: ישראל "נולדה כמדינה יהודית… וכך היא תישאר". במקום 2 ברשימת רע"ם רץ יואב סגלוביץ', לשעבר ראש להב 433. הדמוקרטים גם הצביעו לפסול את יו"ר בל"ד בגלל מאמר שכתב ב-8.10.</p><div class="warn"><b>לשים לב:</b> איזנקוט, בנט וליברמן שוללים את רע"ם. ועבאס סירב ביולי 2026 לענות אם חמאס ארגון טרור.</div>`, say:`הקו ברור: מי שמכיר במדינה יכול להיות שותף, ומי שמצדיק טרור בחוץ. ו-250 רציחות בשנה בחברה הערבית הן בעיה ביטחונית של כולנו.`, src:[S("Globes: עבאס","https://en.globes.co.il/en/article-1001395628"),S("ToI: סגלוביץ'","https://www.timesofisrael.com/jewish-former-mk-yoav-segalovitz-announces-unprecedented-run-with-arab-raam-party/"),S("ynetnews: אבו שחאדה","https://www.ynetnews.com/article/rlrkgsotc"),S("ToI: איזנקוט","https://www.timesofisrael.com/eisenkot-raam-wont-be-in-my-government-pms-approval-of-qatari-funds-between-breach-of-trust-and-treason/")]},
 {t:`"קול מבוזבז, תצביע למפלגה גדולה"`, tags:"קול מבוזבז חסימה סקרים גוש", b:`<p>בסקרים האחרונים, לפני האיסור על פרסום, הדמוקרטים קיבלו 8–10 מנדטים, הרבה מעל אחוז החסימה (כ-4). יש הסכם עודפים עם "ישר!". מעבר קולות בתוך הגוש לא מוסיף לו אף מנדט.</p>`, say:`בנט הקים ממשלה עם 7 מנדטים. מה שקובע זה מי מגיע ל-61, ואף קול לא הולך לאיבוד.`, src:[S("מעריב: סקר","https://www.maariv.co.il/news/elections-2026/article-1377736"),S("וואלה: גולן על הגוש","https://www.walla.co.il/news/politics/383957292")]},
 {t:`"איזנקוט מוביל, אני סומך עליו יותר"`, tags:"איזנקוט ישר מוביל ראש ממשלה", b:`<p>לא לתקוף את איזנקוט: הוא באותו גוש. הוא כבר מוביל, וחסר לו 61. השאלה היא מי יישב לידו. אם הדמוקרטים חלשים, הוא יצטרך שותפים אחרים, ואולי את החרדים.</p>`, say:`איזנקוט איש מצוין, ואני שמחה שאתה בגוש הזה. קול לדמוקרטים הוא קול לממשלה שלו, עם גב חזק יותר.`, src:[S("JPost: איזנקוט","https://www.jpost.com/israel-election-2026/article-912401"),S("JFeed: החרדים","https://www.jfeed.com/news-israel/golan-haredi-coalition-netanyahu")]},
 {t:`"אתם מרצ בתחפושת, שמאל קיצוני"`, who:[1, 11, 5, 7], tags:"מרצ שמאל קיצוני רדיקלי ציונות", b:`<p>זה איחוד של העבודה ומרצ. בראש הרשימה סגן רמטכ"ל, ובה אלוף במילואים, קצין צנחנים דתי ומפקד צוות במגלן. במצע: "ממשלה ליברלית, ציונית וחופשית".</p>`, say:`זו הציונות של רבין ובן-גוריון.`, src:[S("המצע",PLAN),S("ToI: האיחוד","https://www.timesofisrael.com/labor-and-meretz-merge-into-united-liberal-democratic-zionist-party-the-democrats/")]},
 {t:`"אתם שונאי חרדים / נגד היהדות"`, who:[5, 3, 13], tags:"חרדים גיוס שוויון בנטל יהדות דת", b:`<p>העמדה היא שוויון בנטל: לשרת, ואחר כך ללמוד, כמו כל סטודנט. במצע גם שירות לאומי למי שלא משרת בצה"ל. ברשימה רב רפורמי (קריב), רב מסורתי בוגר ישיבה (דבוש) וקצין דתי בוגר ישיבת הסדר (פינק).</p><div class="warn"><b>אם מצטטים "חסרת השכלה":</b> הניסוח היה פוגע, וגולן תיקן: "גיוס לכולם. נקודה."</div>`, say:`אנחנו נגד השתמטות, לא נגד חרדים. יאיא פינק, דתי ובוגר ישיבת הסדר, מוביל את המאבק הזה.`, src:[S("ToI: גולן על הגיוס","https://www.timesofisrael.com/liveblog_entry/slamming-proposed-draft-law-yair-golan-says-no-haredi-men-should-be-exempt-from-military-service/"),S("ערוץ 7: התיקון","https://www.israelnationalnews.com/news/431282")]},
 {t:`"אילו חוקי הפיכה תבטלו?"`, tags:"הפיכה משטרית חוקים ועדה לבחירת שופטים בתי דין יועמש", b:`<p>המצע: "נמפה ונבטל את כל חוקי ההפיכה המשטרית". בשמם מופיעים:</p><ul><li>החוק לשינוי הוועדה לבחירת שופטים (2025).</li><li>הרחבת סמכויות בתי הדין הדתיים (2025–2026).</li></ul><p>עוד חוקים שעברו: חוק היועמ"ש (2026, יש נגדו עתירות), הפרדת מח"ש מהפרקליטות, וחוק הנבצרות (2023). את עילת הסבירות בג"ץ כבר ביטל. בנוסף במצע: חוק יסוד: החקיקה, עיגון זכויות בחוקי יסוד, עד 8 שנים לראש ממשלה, ואיסור כהונה תחת כתב אישום.</p>`, say:`הם לא רק יבטלו את ההפיכה. הם ישלימו את מה שחסר מאז קום המדינה: חוקה שמגנה עליך, לא משנה מי בשלטון.`, src:[S("המצע",PLAN),S("Library of Congress: הוועדה","https://www.loc.gov/item/global-legal-monitor/2025-04-16/israel-knesset-adopts-controversial-reform-on-appointing-judges/"),S("ToI: בתי הדין","https://www.timesofisrael.com/knesset-passes-law-allowing-rabbinical-courts-to-arbitrate-civil-disputes/")]},
 {t:`"מה תעשו בשביל הכיס שלי?"`, who:[2], tags:"יוקר מחיה דיור כלכלה משפחות", b:`<p>במצע: פירוק קרטלי המזון, התרופות והאנרגיה. הוזלת התחבורה הציבורית. דיור ציבורי ושכירות ארוכת טווח. קיצור שבוע העבודה וחופשת לידה לאבות. והעברת "מיליארדים לסיפוח ולמאחזים" לצפון ולדרום. לזימי כבר העבירה חוק שבזכותו חולי סרטן מקבלים דמי מחלה מהיום הראשון.</p>`, say:`במקום תקציבים מגזריים, השקעה במי שעובד ומשרת.`, src:[S("המצע",PLAN),S("סרוגים: חוק לזימי","https://www.srugim.co.il/672147")]},
 {t:`"מצביע עלה ירוק"`, tags:"עלה ירוק השכל ישראל תחילה קנאביס", b:`<p>השנה עלה ירוק רצה עם "ישראל תחילה" של שרן השכל: מפלגת ימין שרוצה ממשלה עם הליכוד, ושללה ישיבה עם גולן. בסקרים קיבלה 0.3%–0.5%.</p><div class="warn"><b>שימי לב:</b> במצע הדמוקרטים אין התייחסות לקנאביס. אל תבטיחי.</div>`, say:`הקול כנראה ילך לפח, ולמפלגה שרוצה ממשלה עם הליכוד. אם אכפת לך מחופש הפרט, הדמוקרטים מבטיחים נישואים אזרחיים ותחבורה ציבורית בשבת.`, src:[S("ויקיפדיה: ישראל תחילה","https://en.wikipedia.org/wiki/Israel_First_(political_party)"),S("JPost: השכל","https://www.jpost.com/israel-news/politics-and-diplomacy/article-904043")]},
 {t:"נקודות חלשות: להודות, לא להכחיש", who:[10, 9, 6], tags:"בשיר רדמן לסקי חולשה גטו", b:`<ul><li><b>סומיה בשיר</b> (מקום 10) השוותה במאי 2025 את עזה לגטו ורשה. לא נמצאה תגובה שלה.</li><li><b>רדמן</b> (מקום 9) פרסם פוסט שנוי במחלוקת אחרי הפיגוע ליד חוות גלעד. גולן: "הייתה טעות… אני מודה".</li><li><b>לסקי</b> (מקום 6): ציטוט מ-2022 על פרנסה לילדי מחבלים. היא התנצלה.</li><li><b>הקלטה ממאי 2026:</b> גולן נשמע מוכן לממשלה רחבה עם מפלגה חרדית. היום הוא מתחייב שהחרדים יהיו באופוזיציה.</li></ul>`, say:`נכון, זה לא היה במקום. מה שחשוב זה מה המפלגה עושה: היא הצביעה לפסול את מי שהצדיק טרור.`, src:[S("ynetnews: בשיר","https://www.ynetnews.com/article/syiudiiqgg"),S("כיכר השבת: רדמן","https://www.kikar.co.il/political-news/lieberman-red-line-democrats-security-justice"),S("מעריב: לסקי","https://www.maariv.co.il/news/opinions/article-1348068")]},
]},

 [3,"גלעד קריב","ח\"כ, רב ועו\"ד",`בוגר 8200. מנכ"ל התנועה הרפורמית. יו"ר ועדת החוקה (2021–2022).`,`הצעת חוק לתיעוד הגבורה של 7.10, עם חותמים מהקואליציה. מאבק על החטופים. רב מתנדב בקהילה על שם אופיר ליבשטיין. עותר נגד חוק היועמ"ש.`,`בדיקה בחשד להדלפת פרוטוקול. אין כתב אישום.`,[S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%92%D7%9C%D7%A2%D7%93_%D7%A7%D7%A8%D7%99%D7%91"),S("ynet","https://www.ynet.co.il/news/article/r15tpngea")]],
 [4,"אפרת רייטן","ח\"כ, יו\"ר הסיעה",`ייצגה את משפחות אסון נחל צפית. יו"ר ועדת העבודה והרווחה.`,`הקימה את השדולה לנרצחי המסיבות, ובזכותה השתנו תנאי הפיצוי לשורדים.`,`לא נמצאה סערה גדולה.`,[S("דבר","https://www.davar1.co.il/540748/"),S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%90%D7%A4%D7%A8%D7%AA_%D7%A8%D7%99%D7%99%D7%98%D7%9F")]],
 [5,"יאיא פינק","רס\"ן במיל', צנחנים",`ייסד את "לובי 99". ראש אגף צדק חברתי בהסתדרות.`,`חזר למילואים ביום הראשון. הקים את מטה המילואימניקים לשוויון בנטל. גייס כספים לשיקום בארי ולילדים שהתייתמו.`,`גייס כסף לתושבי חווארה שבתיהם נשרפו בפרעות 2023.`,[S("מעריב","https://www.maariv.co.il/news/politics/article-1339566"),S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%99%D7%90%D7%99%D7%90_%D7%A4%D7%99%D7%A0%D7%A7")]],
 [6,"גבי לסקי","מרצ, עו\"ד לזכויות אדם",`מייצגת מפגינים וחושפי שחיתויות. כח"כית העבירה חוק על כבוד עצורים.`,`לפי ויקיפדיה: התנדבה בחמ"ל האזרחי, והקימה את רשת "עוצרים" לסיוע לעצורי המחאה.`,`ציטוט מ-2022 על ילדי מחבלים (התנצלה), וסרטון על נשים בעזה.`,[S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%92%D7%91%D7%99_%D7%9C%D7%A1%D7%A7%D7%99"),S("ICE","https://www.ice.co.il/local-news/news/article/1132146")]],
 [7,"עמרי רונן","מפקד צוות במגלן, אחים לנשק",`ממייסדי "מחנכים לציונות" ומובילי אחים לנשק.`,`לחם בעוטף מהבוקר של 7.10. יותר מ-300 ימי מילואים. סבתו נרצחה בכפר עזה. הוביל בנייה מחדש של 16 דירות בקיבוץ.`,`כ"ץ הורה להוציא אותו מהמילואים בגלל אמירה על סרבנות (יולי 2026).`,[S("ynet","https://www.ynet.co.il/news/article/sycm17396"),S("N12","https://www.mako.co.il/news-politics/2026_q3/Article-a7914c8753a7f91027.htm")]],
 [8,"מיכל רוזין","מרצ, ח\"כ לשעבר",`ניהלה את מרכזי הסיוע לנפגעות תקיפה מינית. העבירה חוקי הגנה רבים לנפגעות.`,`תיווכה באיחוד העבודה ומרצ.`,`לא נמצאו התקפות ממוקדות.`,[S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%9E%D7%99%D7%9B%D7%9C_%D7%A8%D7%95%D7%96%D7%99%D7%9F")]],
 [9,"משה רדמן אבוטבול","יזם הייטק, מוביל מחאה",`בן לוד. עזב את הקריירה כדי להוביל את מחאת ההייטק, ויזם את הצעדה לירושלים.`,`לפי ויקיפדיה: שותף לתיעוד הטבח. ייסד את "עוגן לעתיד".`,`הפוסט אחרי הפיגוע ליד חוות גלעד, ועלבונות לשרה נתניהו.`,[S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%9E%D7%A9%D7%94_%D7%A8%D7%93%D7%9E%D7%9F_%D7%90%D7%91%D7%95%D7%98%D7%91%D7%95%D7%9C")]],
 [10,"סומיה בשיר","מטפלת, פעילה חברתית",`מטפלת בילדים עם צרכים מיוחדים מ-1998. שותפה לפורום העממי נגד הפשיעה.`,`נואמת בהפגנות למען החטופים ולמען שותפות יהודית-ערבית.`,`השוואת עזה לגטו ורשה (מאי 2025). לא להכחיש.`,[S("ynetnews","https://www.ynetnews.com/article/syiudiiqgg"),S("N12","https://www.mako.co.il/news-n12_magazine/2026_q3/Article-8b6b5804d338f91026.htm")]],
 [11,"נמרוד שפר","אלוף במיל', טייס קרב",`ראש אגף התכנון בצה"ל, ראש מטה חיל האוויר, ומנכ"ל התעשייה האווירית.`,`חתם על מכתב הטייסים להחזרת החטופים, ולא הסיר את חתימתו גם כשאיימו להפסיק לו את המילואים.`,`מסרונים בפריימריז שיצאו מהצוות שלו. התנצל: "האחריות כולה שלי".`,[S("ynet","https://www.ynet.co.il/news/article/hkqy6n3zeg"),S("כיפה","https://www.kipa.co.il/%D7%97%D7%93%D7%A9%D7%95%D7%AA/1204604-0/")]],
 [12,"מורן זר קצנשטיין","מייסדת בונות אלטרנטיבה",`מנהלת לשעבר בגוגל ובפלייטיקה. הקימה את "בונות אלטרנטיבה" ב-2020.`,`חמ"ל למפונים מצהרי 7.10. מאבק להכרה בפשעי המין של חמאס. ליווי לתצפיתניות ולמשפחותיהן.`,`בקשת פטור ממס לעמותה נדחתה בטענה שהיא פוליטית.`,[S("מאקו","https://www.mako.co.il/news-israel-elections/2026/Article-cc978d99471fd91026.htm"),S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%9E%D7%95%D7%A8%D7%9F_%D7%96%D7%A8_%D7%A7%D7%A6%D7%A0%D7%A9%D7%98%D7%99%D7%99%D7%9F")]],
 [13,"אבי דבוש","שורד נירים, רב",`מאבק סביבתי באשקלון ו"צעדת השוויון" מהנגב. מנכ"ל רבנים לזכויות אדם.`,`שרד את הטבח בנירים עם משפחתו וחזר לגור בעוטף.`,`הארגון שלו תמך בצווי בית הדין בהאג נגד נתניהו וגלנט.`,[S("זמן ישראל","https://www.zman.co.il/677735/"),S("וואלה","https://www.walla.co.il/news/opinions/3638017")]],
 [14,"אמילי מואטי","ח\"כ לשעבר, סגנית יו\"ר הכנסת",`חברת ועדת החוץ והביטחון. עזבה את התיכון כדי לעזור בפרנסת המשפחה, וזכתה בפרס ספרותי.`,`הובילה את המחלקה המדינית של פורום משפחות החטופים: יותר מ-200 מחוקקים ו-40 ראשי מדינות. ממשיכה בקמפיין תוך כדי טיפול בסרטן.`,`ייעצה לרשימה המשותפת ב-2015.`,[S("Jewish Insider","https://jewishinsider.com/2023/12/israel-hostages-and-missing-persons-families-forum-gaza-hamas/"),S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%90%D7%9E%D7%99%D7%9C%D7%99_%D7%9E%D7%95%D7%90%D7%98%D7%99")]],
 [15,"תומר אביטל","עיתונאי חוקר, מייסד \"שקוף\"",`התחקירים שלו הובילו לחקירה בפרשת הוצאות מעון ראש הממשלה, וחשפו את הלוביסטים בכנסת.`,`מלמד אזרחים לזהות פייק ניוז ("סיירת האמת").`,`אמר על עבאס "זה הערבי שחיכינו לו".`,[S("ויקיפדיה","https://he.wikipedia.org/wiki/%D7%AA%D7%95%D7%9E%D7%A8_%D7%90%D7%91%D7%99%D7%98%D7%9C"),S("סרוגים","https://www.srugim.co.il/101005958")]],
]},

{id:"facts", label:"עובדות", lead:"מספרים שאפשר להראות בטלפון.", items:[
 {t:"סקרים: הדמוקרטים יציבים מעל החסימה", tags:"סקרים מנדטים", b:`<div class="tbl"><table><tr><th>מתי</th><th>גוף</th><th>מנדטים</th></tr><tr><td>יולי 2024</td><td>ערוץ 14</td><td>10</td></tr><tr><td>דצמבר 2024</td><td>מעריב</td><td>13</td></tr><tr><td>מאי 2025</td><td>חדשות 12</td><td>13</td></tr><tr><td>ספטמבר 2026</td><td>מעריב</td><td>11</td></tr><tr><td>14–15.10.2026</td><td>מעריב</td><td>9</td></tr></table></div><p>אחוז החסימה הוא כ-4 מנדטים. פרסום סקרים אסור מ-23.10, אז כל "סקר חדש" ברשת חשוד.</p>`, src:[S("ויקיפדיה: סקרים","https://en.wikipedia.org/wiki/Opinion_polling_for_the_2026_Israeli_legislative_election"),S("מעריב","https://www.maariv.co.il/news/elections-2026/article-1377736")]},
 {t:"המפלגה: פריימריז פתוחים", tags:"פריימריז מתפקדים", b:`<p>כ-112 אלף מתפקדים. ב-20.7.2026 כ-97 אלף מהם הצביעו בפריימריז, 86%. הם רצים לבד, בפתק אמת.</p>`, src:[S("ynet","https://www.ynetnews.com/article/synmdasnzx"),S("אתר המפלגה","https://democrats.org.il/team/")]},
 {t:"7 באוקטובר והחטופים", tags:"7 באוקטובר חטופים נרצחים", b:`<p>1,195 נרצחו, מהם 828 אזרחים. 251 נחטפו. 20 החטופים החיים האחרונים חזרו ב-13.10.2025. גופת החטוף האחרון, רס"ר רן גוילי, הוחזרה ב-26.1.2026.</p>`, src:[S("ויקיפדיה","https://en.wikipedia.org/wiki/October_7_attacks"),S("Al-Monitor","https://www.al-monitor.com/originals/2026/01/israel-returns-remains-last-gaza-hostage-ran-gvili")]},
 {t:"דמוגרפיה בין הים לירדן", tags:"דמוגרפיה אוכלוסייה רוב יהודי", b:`<div class="tbl"><table><tr><th>אוכלוסייה (סוף 2025)</th><th>מיליון</th></tr><tr><td>יהודים ואחרים בישראל</td><td>7.77</td></tr><tr><td>ערבים אזרחי ישראל</td><td>2.15</td></tr><tr><td>פלסטינים בגדה</td><td>3.43</td></tr><tr><td>פלסטינים בעזה</td><td>2.13</td></tr></table></div><p>יש ספירה כפולה במזרח ירושלים, אז אמרי "בערך חצי-חצי" ולא "רוב ערבי".</p>`, src:[S("למ\"ס דרך כיפה","https://www.kipa.co.il/%D7%97%D7%93%D7%A9%D7%95%D7%AA/1231357-0/"),S("למ\"ס הפלסטינית","https://www.pcbs.gov.ps/portals/_pcbs/PressRelease/Press_En_PalPeopleEnd2025E.pdf")]},
 {t:"פשיעה בחברה הערבית", tags:"פשיעה רציחות ערבים משטרה", b:`<ul><li>2025: לפחות 241 נרצחים לפי המשטרה, 252 לפי AFP, לעומת 47 בחברה היהודית. לפי גודל האוכלוסייה, פי 10 ויותר.</li><li>2022: 120. 2023: 244.</li><li>2026: לפי העדכון האחרון של יוזמות אברהם, 186 (תאריך העדכון לא אומת). מעט פחות מ-2025, אז לא לקרוא לה "שנת שיא".</li><li>רק כ-15% מהרציחות בחברה הערבית מפוענחות, לעומת כ-65% בחברה היהודית.</li></ul>`, say:`זה לא "בעיה שלהם". ארגוני פשיעה עם מאות אלפי כלי נשק, כשרק 15% מהרציחות מפוענחות.`, src:[S("Boston Globe","https://bostonglobe.com/2026/02/10/world/israelis-protest-surge-gun-crime-within-arab-community"),S("זמן ישראל","https://zman.co.il/live/735883"),S("Gordis","https://danielgordis.substack.com/p/an-israeli-arab-gets-murdered-almost"),S("מבקר המדינה","https://library.mevaker.gov.il/sites/DigitalLibrary/Documents/2021/71C/2021-71c-502-Amlach-EN-Taktzir.pdf")]},
 {t:"עמדת הציבור: הניסוח קובע", tags:"סקרים מדינה פלסטינית ציבור מיתווים", b:`<ul><li>מיתווים (אוגוסט 2025): 55% בעד עסקת חבילה של מדינה מפורזת, חטופים, פירוק חמאס ונורמליזציה. 72% במרכז.</li><li>INSS (פברואר 2026): 28% בעד הסכם עם סעודיה שכולל מדינה פלסטינית.</li><li>מדד השלום (נובמבר 2025, יהודים): 20% שתי מדינות, 30% סטטוס קוו, 38% סיפוח.</li></ul><p>לכן עדיף לדבר על "היפרדות בתנאי ביטחון" ולא על "מדינה".</p>`, src:[S("מיתווים","https://mitvim.org.il/wp-content/uploads/2025/09/Mitvim-Institute-%E2%80%93-The-Israeli-Foreign-Policy-Index-2025-%E2%80%93-Key-Findings-1.pdf"),S("INSS","https://www.inss.org.il/he/?p=136595"),S("מדד השלום","https://en-social-sciences.tau.ac.il/sites/socsci-english.tau.ac.il/files/media_server/social/peaceindex/2025-11.pdf")]},
 {t:"ציר זמן קצר של הסכסוך", tags:"היסטוריה אוסלו מצרים ירדן קמפ דייוויד", b:`<div class="tbl"><table><tr><td>1947</td><td>תוכנית החלוקה: היהודים קיבלו, הערבים דחו</td></tr><tr><td>1979</td><td>שלום עם מצרים: בגין מהליכוד החזיר את סיני</td></tr><tr><td>1993–95</td><td>הסכמי אוסלו</td></tr><tr><td>1994</td><td>שלום עם ירדן</td></tr><tr><td>2000</td><td>קמפ דייוויד: ערפאת דחה</td></tr><tr><td>2003</td><td>שרון: "להחזיק 3.5 מיליון פלסטינים תחת כיבוש זה רע לנו ולהם"</td></tr><tr><td>2005</td><td>התנתקות חד-צדדית</td></tr><tr><td>2007</td><td>חמאס תופס את עזה</td></tr><tr><td>2008</td><td>הצעת אולמרט: אבו מאזן לא השיב</td></tr><tr><td>2020</td><td>הסכמי אברהם</td></tr></table></div>`, src:[S("INSS: אוסלו","https://www.inss.org.il/publication/oslo-revisited-are-the-fundamental-assumptions-still-valid/"),S("Washington Times: שרון","https://www.washingtontimes.com/news/2003/may/27/20030527-124704-5818r/")]},
 {t:"איך מזהים פייק", tags:"פייק חמל זיוף", b:`<ul><li>ציטוט בלי מקור או בלי תאריך. "מדינה מצורעת" ו"למלא את הרחובות" לא נמצאו במקור.</li><li>צילום מסך של "ציוץ" בלי קישור.</li><li>"דיווח" שמופיע רק בוואטסאפ.</li><li>ציטוט שהודבק לאירוע אחר: "תתי אדם" נאמר על חומש, לא על חווארה.</li></ul><p>לצלם מסך, לשלוח לחמ"ל, לא להעביר הלאה.</p>`, src:[]},
]},

{id:"parties", label:"מפלגות", lead:"מי עוד בגוש ומחוצה לו, ומה הם אמרו.", items:[
 {t:"ישר! (איזנקוט)", tags:"איזנקוט ישר", b:`<p>מוביל בסקרים. "לא אכהן תחת נתניהו, אפילו לא ברוטציה". רע"ם "לא תהיה בממשלה שלי". יש לו הסכם עודפים עם הדמוקרטים. מבקר את בנט וליברמן על כך שלא תומכים בו.</p>`, say:`איזנקוט בגוש שלנו. השאלה היא מי יישב לידו.`, src:[S("JPost","https://www.jpost.com/israel-election-2026/article-912401"),S("ToI: רע\"ם","https://www.timesofisrael.com/eisenkot-raam-wont-be-in-my-government-pms-approval-of-qatari-funds-between-breach-of-trust-and-treason/")]},
 {t:"ביחד (בנט ולפיד)", tags:"בנט לפיד ביחד", b:`<p>רשימה משותפת בראשות בנט. הוא הציע שנתניהו יוכל לשבת בממשלה ולקבל תיק אם יקבל את "קווי היסוד", ואחר כך חזר בו. שולל ישיבה עם רע"ם.</p>`, src:[S("ToI","https://www.timesofisrael.com/bennett-suggests-netanyahu-could-be-part-of-future-government-quickly-backtracks/")]},
 {t:"ישראל ביתנו (ליברמן)", tags:"ליברמן ישראל ביתנו", b:`<p>"לא תקום קואליציה עם המפלגות הערביות". הודיע שלא ייתן לדמוקרטים את הביטחון, המשפטים וביטחון הפנים. מאשים את איזנקוט שהוא מתכנן ממשלה עם נתניהו: "גנץ 2". תומך בחוק "אפס נאשמים".</p>`, src:[S("ynetnews","https://www.ynetnews.com/article/syi6gsjnfx"),S("כיכר השבת","https://www.kikar.co.il/political-news/lieberman-red-line-democrats-security-justice")]},

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let current = "msg";
try{ const h=location.hash.slice(1); if(SECTIONS.some(s=>s.id===h)) current=h; else { const v=localStorage.getItem("shalif-tab"); if(v && SECTIONS.some(s=>s.id===v)) current=v; } }catch(e){}

function srcHtml(src){ return src&&src.length?`<div class="src">${src.map(([l,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)}</a>`).join("")}</div>`:""; }
function sayHtml(say){ return say?`<div class="say"><span class="lbl">משפט לשטח</span><q>${esc(say)}</q><button class="copy" type="button" data-copy="${esc(say)}">העתקה</button></div>`:""; }
function personBy(n){ return SECTIONS.find(s=>s.people).people.find(p=>p[0]===n); }
function facesHtml(who){
  if(!who||!who.length) return "";
  return `<div class="faces">${who.map(n=>{const p=personBy(n); const img=PHOTOS[String(n).padStart(2,"0")]; return `<span class="face">${img?`<img src="${img}" alt="">`:""}${esc(p[1])}</span>`;}).join("")}</div>`;
}
function itemHtml(it, secLabel){
  return `<details class="card"><summary><span class="t">${esc(it.t)}</span>${secLabel?`<span class="sec">${esc(secLabel)}</span>`:""}</summary><div class="body">${facesHtml(it.who)}${it.b}${sayHtml(it.say)}${srcHtml(it.src)}</div></details>`;
}
function peopleTable(list){
  return `<h2 class="subhead">מה כל אחד עשה, בטבלה</h2><div class="ptable"><table><tr><th>מי</th><th>לפני 7.10</th><th>מאז 7.10</th></tr>${list.map(p=>{const img=PHOTOS[String(p[0]).padStart(2,"0")]; return `<tr><td><div class="who">${img?`<img src="${img}" alt="">`:""}<span>${p[0]}. ${esc(p[1])}<small>${esc(p[2])}</small></span></div></td><td>${esc(p[3])}</td><td>${esc(p[4])}</td></tr>`;}).join("")}</table></div><h2 class="subhead">כרטיס לכל אחד, עם מקורות</h2>`;
}
function personHtml(p, secLabel){
  const [n,name,role,before,after,weak,src]=p;
  const img = PHOTOS[String(n).padStart(2,"0")];
  return `<details class="card person"><summary><span class="num">${n}</span>${img?`<img src="${img}" alt="${esc(name)}" loading="lazy">`:""}<span class="t">${esc(name)}<span class="role">${esc(role)}</span></span>${secLabel?`<span class="sec">${esc(secLabel)}</span>`:""}</summary><div class="body"><p><b>לפני 7.10:</b> ${esc(before)}</p><p><b>מאז 7.10:</b> ${esc(after)}</p><div class="warn"><b>נקודה רגישה:</b> ${esc(weak)}</div>${srcHtml(src)}</div></details>`;
}
function textOf(x){ return Array.isArray(x)? x.slice(1,6).join(" ") : [x.t,x.b,x.say||"",x.tags||""].join(" ").replace(/<[^>]+>/g," "); }
function norm(s){ return s.toLowerCase().replace(/["'״׳`]/g,"").replace(/\s+/g," "); }

function renderTabs(){
  $("#tabs").innerHTML = SECTIONS.map(s=>`<button role="tab" type="button" data-tab="${s.id}" aria-selected="${s.id===current}">${s.label}</button>`).join("");
}
function render(){
  const q = norm($("#q").value.trim());
  const main = $("#main");
  if(q){
    const terms=q.split(" ").filter(Boolean); let html="";
    SECTIONS.forEach(s=>{ (s.items||s.people).forEach(x=>{ const t=norm(textOf(x)); if(terms.every(w=>t.includes(w))) html+= s.people?personHtml(x,s.label):itemHtml(x,s.label); }); });
    main.innerHTML = `<p class="lead">תוצאות חיפוש</p><div class="list">${html||`<div class="empty">לא נמצא. נסי מילה אחרת, למשל "גולן" או "סעודיה".</div>`}</div>`;
    return;
  }
  const s = SECTIONS.find(x=>x.id===current);
  main.innerHTML = `<p class="lead">${esc(s.lead)}</p>${s.people?peopleTable(s.people):""}<div class="list">${(s.items||[]).map(i=>itemHtml(i)).join("")}${(s.people||[]).map(p=>personHtml(p)).join("")}</div>`;
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); btn.textContent="הועתק"; }
  catch(e){ const r=document.createRange(); const el=btn.previousElementSibling||btn; r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent="סמנתי, העתיקי ידנית"; }
  setTimeout(()=>btn.textContent="העתקה",1800);
}
document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){ current=tab.dataset.tab; try{localStorage.setItem("shalif-tab",current);}catch(_){} $("#q").value=""; renderTabs(); render(); window.scrollTo({top:0}); return; }
  const c=e.target.closest("[data-copy]"); if(c){ copyText(c.dataset.copy,c); return; }
  if(e.target.id==="hotcopy"){ copyText("0522489198", e.target); }
});
$("#q").addEventListener("input",render);
document.documentElement.lang="he"; document.documentElement.dir="rtl";
renderTabs(); render();
</script>
