<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוסי בת 12</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="יעל וענת אוספות ומסמנות תמונות לסרטון בת המצווה של לוסי">
<meta property="og:title" content="לוסי בת 12 ✨">
<meta property="og:description" content="מוסיפות תמונות, מסמנות מה לא רלוונטי ואיפה לוסי">
<meta property="og:image" content="https://yaelavgil.github.io/yaella/lucy/og.jpg">
<link rel="icon" href="/yaella/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/yaella/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/yaella/apple-touch-icon.png">
<meta name="theme-color" content="#fbf5ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Lean two-person sorting app: header, filter chips + add button, a photo grid; tapping a photo opens it big, where you mark relevance and tap Lucy's face. */
:root{
  --bg:#fbf5ef; --paper:#fffdfb; --ink:#2b2226; --muted:#7d6f74; --line:#efe3da;
  --blush:#e2708a; --blush-soft:#fbe3e8; --mint:#4f9d80; --gold:#c99a3c;
  --display:"Amatic SC","Assistant",cursive; --body:"Assistant","Arial Hebrew",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1518; --paper:#251d21; --ink:#f6ece8; --muted:#b9a8ad; --line:#3a2e33; --blush:#f08aa1; --blush-soft:#4a2a33; --mint:#6cc4a2; --gold:#e2b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1518; --paper:#251d21; --ink:#f6ece8; --muted:#b9a8ad; --line:#3a2e33; --blush:#f08aa1; --blush-soft:#4a2a33; --mint:#6cc4a2; --gold:#e2b45a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
header{text-align:center;padding:26px 16px 10px}
h1{font-family:var(--display);font-size:clamp(54px,13vw,88px);line-height:.85;margin:0}
h1 span{color:var(--blush)}
.sum{color:var(--muted);font-size:14px;margin-top:6px}
.sum b{color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1100px;margin:0 auto;padding:9px 16px;display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.6;font-weight:600}
.add{flex:none;border:0;background:var(--blush);color:#fff;border-radius:999px;padding:7px 16px;font-weight:800}
main{max-width:1100px;margin:0 auto;padding:12px 16px 80px}
h2{font-family:var(--display);font-size:40px;line-height:1;margin:22px 0 8px}
h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:600;margin-inline-start:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.t{position:relative;border-radius:14px;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.t button.ph{display:block;width:100%;aspect-ratio:1;border:0;padding:0;background:var(--blush-soft)}
.t img{width:100%;height:100%;object-fit:cover;display:block}
.t.no img{filter:grayscale(1);opacity:.35}
.t .tag{position:absolute;top:6px;inset-inline-start:6px;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:rgba(20,10,14,.62);color:#fff}
.t .st{position:absolute;bottom:6px;inset-inline-end:6px;display:flex;gap:4px}
.t .st span{font-size:12px;font-weight:800;border-radius:999px;padding:1px 7px;color:#fff}
.s-no{background:#6b5a60}.s-nl{background:var(--gold);color:#2b2226!important}.s-l{background:var(--blush)}
.empty{text-align:center;color:var(--muted);padding:60px 16px}
.empty b{display:block;font-family:var(--display);font-size:46px;color:var(--ink);font-weight:700}
dialog{border:0;border-radius:20px;padding:0;background:var(--paper);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35);width:min(480px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(30,15,20,.55)}
.dl{padding:20px;display:grid;gap:12px}
.dl h3{font-family:var(--display);font-size:38px;line-height:1;margin:0}
.dl label{display:grid;gap:4px;font-weight:700;font-size:14px}
.dl input,.dl select{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:800}
.btn.pri{background:var(--blush);border-color:var(--blush);color:#fff}
.drop{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.q{display:grid;gap:4px;max-height:160px;overflow:auto;font-size:13px}
.q div{display:flex;justify-content:space-between;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:0}
/* viewer */
.vw{position:fixed;inset:0;z-index:20;background:#140c10;color:#fff;display:none;grid-template-rows:auto 1fr auto}
.vw.open{display:grid}
.vw .top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.vw .top .ttl{flex:1;min-width:0;font-weight:700;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;width:40px;height:40px;font-size:18px;flex:none}
.stage{position:relative;display:grid;place-items:center;min-height:0;overflow:hidden}
.frame{position:relative;max-width:100%;max-height:100%;display:inline-block;line-height:0}
.frame img,.frame video{max-width:100vw;max-height:calc(100dvh - 170px);display:block;object-fit:contain}
.frame.marking{cursor:crosshair}
.pin{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:3px solid var(--blush);border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.35);pointer-events:none}
.pin::after{content:"לוסי";position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;background:var(--blush);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:0 7px;line-height:1.6;white-space:nowrap}
.navb{position:absolute;top:50%;transform:translateY(-50%)}
.navb.p{inset-inline-start:8px}.navb.n{inset-inline-end:8px}
.bot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
.bot .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.bot .btn.on{background:var(--blush);border-color:var(--blush)}
.bot .btn.onno{background:#6b5a60;border-color:#6b5a60}
.bot .btn.onnl{background:var(--gold);border-color:var(--gold);color:#2b2226}
.bot .who{width:100%;text-align:center;font-size:12px;opacity:.7}
.mk{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--blush);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:4px 14px;z-index:2}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.t{border-radius:10px}}
</style>
</head>
<body>
<header>
  <h1>לוסי <span>בת 12</span> ✨</h1>
  <div class="sum" id="sum"></div>
</header>
<div class="bar"><div class="in">
  <div class="chips" id="chips" role="group" aria-label="סינון"></div>
  <button class="add" id="addBtn">+ הוספה</button>
</div></div>
<main id="main"><div class="empty"><b>רגע…</b>טוענות</div></main>

<dialog id="gate"><form class="dl" method="dialog" id="gateForm">
  <h3>ברוכה הבאה 💛</h3>
  <p class="hint">מקלידות את קוד הגישה שקיבלת מיעל. צריך רק פעם אחת בכל מכשיר.</p>
  <label>קוד גישה<input id="gateCode" autocomplete="off" inputmode="numeric" required></label>
  <div class="row"><button class="btn pri">כניסה</button></div>
</form></dialog>

<dialog id="nameDlg"><form class="dl" method="dialog" id="nameForm">
  <h3>מי את?</h3>
  <div class="row" id="nameQuick"><button class="btn" value="יעל">יעל</button><button class="btn" value="ענת">ענת</button></div>
  <label>או שם אחר<input id="nameInp" autocomplete="given-name"></label>
  <div class="row"><button class="btn pri" value="">המשך</button></div>
</form></dialog>

<dialog id="addDlg"><div class="dl">
  <h3>הוספת תמונות</h3>
  <label>שנה<select id="addYear"></select></label>
  <button class="drop" id="drop" type="button">לוחצות כאן לבחירת תמונות וסרטונים<br><span class="hint">או גוררות לכאן · סרטון עד 45MB</span></button>
  <input type="file" id="file" accept="image/*,video/*" multiple hidden>
  <div class="q" id="queue"></div>
  <div class="row"><button class="btn" type="button" id="addClose">סיום</button></div>
</div></dialog>

<div class="vw" id="vw" role="dialog" aria-modal="true" aria-label="צפייה בתמונה">
  <div class="top"><button class="ic" id="vClose" aria-label="סגירה">✕</button><div class="ttl" id="vTtl"></div><button class="ic" id="vDel" aria-label="מחיקה">🗑</button></div>
  <div class="stage" id="stage"></div>
  <div class="bot" id="bot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
const DB='https://home-picks-47450-default-rtdb.europe-west1.firebasedatabase.app';
const VIDEO_MAX=45*1024*1024, CHUNK=600*1024;
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let ROOT=null, ME=ls.get('lucy_name')||'', items={}, F='todo', list=[], vlist=[], idx=-1, marking=false, objUrl=null;
const thumbs={};

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2000)}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s.trim().toLowerCase()));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24)}
const U=p=>`${DB}/${ROOT}/${p}.json`;
const get=async p=>{const r=await fetch(U(p));if(!r.ok)throw 0;return r.json()};
const put=async(p,v)=>{const r=await fetch(U(p),{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw 0};
const patch=async(p,v)=>{const r=await fetch(U(p),{method:'PATCH',body:JSON.stringify(v)});if(!r.ok)throw 0};
const del=p=>fetch(U(p),{method:'DELETE'});

/* entry: code comes from the link (#k=...) and is remembered on this device */
async function boot(){
  const m=location.hash.match(/k=([^&]+)/); let code=m?decodeURIComponent(m[1]):ls.get('lucy_code');
  if(m){ls.set('lucy_code',code);history.replaceState(null,'',location.pathname)}
  if(!code){$('#gate').showModal();return}
  ROOT='lucy_'+await sha(code);
  try{ if(!await get('meta')){ls.set('lucy_code','');$('#main').innerHTML='<div class="empty"><b>אופס</b>הקוד לא נכון</div>';return} }
  catch(e){$('#main').innerHTML='<div class="empty"><b>אין חיבור</b>נסי לרענן</div>';return}
  if(!ME) $('#nameDlg').showModal();
  const es=new EventSource(U('items'));
  const on=ev=>{const {path,data}=JSON.parse(ev.data);apply(path,data,ev.type==='patch');render();if($('#vw').classList.contains('open'))paintBot()};
  es.addEventListener('put',on);es.addEventListener('patch',on);
}
function apply(path,data,isPatch){
  const ps=path.split('/').filter(Boolean);
  if(!ps.length){items=isPatch?Object.assign(items,data||{}):(data||{});return}
  let o=items;for(let i=0;i<ps.length-1;i++){o[ps[i]]=o[ps[i]]||{};o=o[ps[i]]}
  const k=ps[ps.length-1]; if(data===null)delete o[k]; else if(isPatch)o[k]=Object.assign(o[k]||{},data); else o[k]=data;
}
$('#gateForm').onsubmit=async()=>{ls.set('lucy_code',$('#gateCode').value.trim());boot()};
$('#nameForm').onsubmit=e=>{const v=e.submitter&&e.submitter.value||$('#nameInp').value.trim();if(!v){e.preventDefault();return}ME=v;ls.set('lucy_name',ME);render()};

/* status of an item: no = not relevant, nolucy = Lucy isn't in it, lucy = where she is */
const FILTERS=[
  ['todo','לבדוק',i=>!i.no&&!i.nolucy&&!i.lucy],
  ['all','הכל',i=>true],
  ['ok','רלוונטי',i=>!i.no&&!i.nolucy],
  ['marked','לוסי מסומנת',i=>!!i.lucy],
  ['no','לא רלוונטי',i=>!!i.no],
  ['nolucy','בלי לוסי',i=>!!i.nolucy],
  ['video','סרטונים',i=>i.kind==='video'],
];
function all(){return Object.entries(items).filter(([,v])=>v&&v.kind).map(([id,v])=>Object.assign({id},v))}
function render(){
  const A=all();
  const ok=A.filter(i=>!i.no&&!i.nolucy).length;
  $('#sum').innerHTML=A.length?`<b>${A.length}</b> פריטים · <b>${ok}</b> רלוונטיים · <b>${A.filter(i=>i.lucy).length}</b> עם לוסי מסומנת${ME?` · את <b>${esc(ME)}</b> (<a href="#" id="chg" style="color:inherit">החלפה</a>)`:''}`:'';
  const c=$('#chg'); if(c) c.onclick=e=>{e.preventDefault();$('#nameDlg').showModal()};
  $('#chips').innerHTML=FILTERS.map(([k,l,fn])=>`<button class="chip" data-f="${k}" aria-pressed="${F===k}">${l} <small>${A.filter(fn).length}</small></button>`).join('');
  const fn=FILTERS.find(f=>f[0]===F)[2];
  const vis=A.filter(fn).sort((a,b)=>(a.year||0)-(b.year||0)||(a.taken||a.at||0)-(b.taken||b.at||0));
  list=vis.map(i=>i.id);
  if(!A.length){$('#main').innerHTML='<div class="empty"><b>עוד ריק כאן</b>לוחצות על „+ הוספה” ומעלות תמונות</div>';return}
  if(!vis.length){$('#main').innerHTML=`<div class="empty"><b>${F==='todo'?'הכל נבדק 🎉':'אין כאן כלום'}</b></div>`;return}
  const g={}; vis.forEach(i=>(g[i.year||'—']=g[i.year||'—']||[]).push(i));
  $('#main').innerHTML=Object.entries(g).map(([y,l])=>`<h2>${y}<small>${/^\d+$/.test(y)?'לוסי בת '+Math.max(0,y-2014)+' · ':''}${l.length}</small></h2><div class="grid">${l.map(tile).join('')}</div>`).join('');
  document.querySelectorAll('img[data-t]').forEach(img=>{const id=img.dataset.t;thumbs[id]?img.src=thumbs[id]:io.observe(img)});
}
function tile(i){
  return `<div class="t ${i.no||i.nolucy?'no':''}"><button class="ph" data-o="${i.id}" aria-label="פתיחה"><img data-t="${i.id}" alt=""></button>
  ${i.kind==='video'?`<span class="tag">▶ ${fmt(i.dur)}</span>`:''}
  <div class="st">${i.no?'<span class="s-no">לא רלוונטי</span>':''}${i.nolucy?'<span class="s-nl">בלי לוסי</span>':''}${i.lucy?'<span class="s-l">לוסי ✓</span>':''}</div></div>`;
}
const io=new IntersectionObserver(es=>es.forEach(async e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const id=e.target.dataset.t;try{const d=await get('thumbs/'+id);if(d){thumbs[id]=d;e.target.src=d}}catch(x){}}),{rootMargin:'300px'});
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f]');if(f){F=f.dataset.f;render();return}
  const o=e.target.closest('[data-o]');if(o){vlist=list.slice();open(o.dataset.o);return}
});

/* viewer */
async function open(id){
  idx=vlist.indexOf(id); marking=false; const it=items[id]; if(!it)return;
  $('#vw').classList.add('open'); document.body.style.overflow='hidden';
  $('#vTtl').textContent=[it.year,it.caption].filter(Boolean).join(' · ');
  if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}
  $('#stage').innerHTML=`<button class="ic navb p" data-nav="-1" aria-label="הקודם">›</button><div class="frame" id="frame"><img src="${thumbs[id]||''}" alt="" style="opacity:.6"></div><button class="ic navb n" data-nav="1" aria-label="הבא">‹</button>`;
  paintBot();
  try{
    if(it.kind==='photo'){const full=await get('full/'+id); if(vlist[idx]===id&&full){$('#frame').innerHTML=`<img src="${full}" alt="">`;paintPin()}}
    else{const parts=[];for(let i=0;i<(it.chunks||0);i++){const c=await get(`vid/${id}/${i}`);parts.push(Uint8Array.from(atob(c),ch=>ch.charCodeAt(0)));if(vlist[idx]!==id)return}
      objUrl=URL.createObjectURL(new Blob(parts,{type:it.mime||'video/mp4'}));$('#frame').innerHTML=`<video src="${objUrl}" controls playsinline autoplay></video>`;paintPin()}
  }catch(e){toast('הטעינה נכשלה')}
}
function paintPin(){
  const it=items[vlist[idx]], fr=$('#frame'); if(!fr||!it)return;
  fr.querySelectorAll('.pin,.mk').forEach(p=>p.remove()); fr.classList.toggle('marking',marking);
  if(it.lucy){const p=document.createElement('div');p.className='pin';p.style.left=(it.lucy.x*100)+'%';p.style.top=(it.lucy.y*100)+'%';fr.appendChild(p)}
  if(marking){const m=document.createElement('div');m.className='mk';m.textContent='לוחצות על הפנים של לוסי';fr.appendChild(m)}
}
function paintBot(){
  const id=vlist[idx], it=items[id]; if(!it)return;
  const by=[it.noBy&&('לא רלוונטי: '+it.noBy),it.nolucyBy&&('בלי לוסי: '+it.nolucyBy),it.lucy&&it.lucy.by&&('סימנה את לוסי: '+it.lucy.by),it.by&&('העלתה: '+it.by)].filter(Boolean).join(' · ');
  $('#bot').innerHTML=`
    <button class="btn ${marking?'on':''}" data-a="mark">📍 ${it.lucy?'לסמן מחדש את לוסי':'איפה לוסי?'}</button>
    <button class="btn ${it.nolucy?'onnl':''}" data-a="nolucy">🙈 אין כאן לוסי</button>
    <button class="btn ${it.no?'onno':''}" data-a="no">✕ לא רלוונטי</button>
    <button class="btn" data-a="next">הבא ‹</button>
    <div class="who">${esc(by)} · ${idx+1}/${vlist.length}</div>`;
  paintPin();
}
async function act(a){
  const id=vlist[idx], it=items[id]; if(!ME){$('#nameDlg').showModal();return}
  try{
    if(a==='mark'){marking=!marking;paintBot();return}
    if(a==='next'){step(1);return}
    if(a==='no'){const v=!it.no;await patch('items/'+id,{no:v||null,noBy:v?ME:null})}
    if(a==='nolucy'){const v=!it.nolucy;await patch('items/'+id,{nolucy:v||null,nolucyBy:v?ME:null,lucy:v?null:(it.lucy||null)})}
  }catch(e){toast('השמירה נכשלה')}
}
$('#bot').onclick=e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a)};
$('#stage').addEventListener('click',async e=>{
  const n=e.target.closest('[data-nav]');if(n){step(+n.dataset.nav);return}
  if(!marking)return; const media=e.target.closest('#frame img,#frame video');if(!media)return;
  const r=media.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  const id=vlist[idx]; marking=false;
  try{await patch('items/'+id,{lucy:{x:+x.toFixed(4),y:+y.toFixed(4),by:ME},nolucy:null,nolucyBy:null});toast('סומן 📍')}catch(x){toast('השמירה נכשלה')}
});
function step(d){if(!vlist.length)return;idx=(idx+d+vlist.length)%vlist.length;open(vlist[idx])}
function close(){$('#vw').classList.remove('open');document.body.style.overflow='';$('#stage').innerHTML='';if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}}
$('#vClose').onclick=close;
$('#vDel').onclick=async()=>{const id=vlist[idx];if(!confirm('למחוק את הפריט לגמרי? אי אפשר לשחזר.'))return;
  await Promise.all([del('items/'+id),del('thumbs/'+id),del('full/'+id),del('vid/'+id)]);close();toast('נמחק')};
document.addEventListener('keydown',e=>{if(!$('#vw').classList.contains('open'))return;
  if(e.key==='Escape')close(); if(e.key==='ArrowLeft')step(1); if(e.key==='ArrowRight')step(-1);
  if(e.key==='x'||e.key==='ס')act('no'); if(e.key==='l'||e.key==='ך')act('mark')});
let tx=null;$('#stage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#stage').addEventListener('touchend',e=>{if(tx==null||marking)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)step(dx>0?1:-1);tx=null});

/* add */
const Y=new Date().getFullYear();
$('#addYear').innerHTML='<option value="auto">לפי תאריך הקובץ</option>'+Array.from({length:Y-2013},(_,i)=>Y-i).map(y=>`<option value="${y}">${y} · לוסי בת ${y-2014}</option>`).join('');
$('#addBtn').onclick=()=>ME?$('#addDlg').showModal():$('#nameDlg').showModal();
$('#addClose').onclick=()=>$('#addDlg').close();
const fileInp=$('#file'), drop=$('#drop');
drop.onclick=()=>fileInp.click();
drop.ondragover=e=>e.preventDefault(); drop.ondrop=e=>{e.preventDefault();handle([...e.dataTransfer.files])};
fileInp.onchange=()=>{handle([...fileInp.files]);fileInp.value=''};
async function handle(files){for(const f of files){const row=document.createElement('div');row.innerHTML=`<span>${esc(f.name)}</span><span>…</span>`;$('#queue').prepend(row);const st=row.lastChild;
  try{await upload(f,p=>st.textContent=Math.round(p*100)+'%');st.textContent='✓'}catch(e){st.textContent=e.message||'נכשל'}}}
const img=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('פורמט לא נתמך'));i.src=src});
function jpg(s,max){const W=s.width||s.videoWidth,H=s.height||s.videoHeight,k=Math.min(1,max/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);c.getContext('2d').drawImage(s,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.86)}
function sq(s){const W=s.width||s.videoWidth,H=s.height||s.videoHeight,m=Math.min(W,H),c=document.createElement('canvas');c.width=c.height=400;c.getContext('2d').drawImage(s,(W-m)/2,(H-m)/2,m,m,0,0,400,400);return c.toDataURL('image/jpeg',.8)}
const b64=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
async function upload(f,prog){
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6), ys=$('#addYear').value;
  const meta={year:ys==='auto'?new Date(f.lastModified||Date.now()).getFullYear():+ys,by:ME,at:Date.now(),taken:f.lastModified||Date.now()};
  const u=URL.createObjectURL(f);
  try{
    if(f.type.startsWith('image/')||/\.(heic|heif)$/i.test(f.name)){
      const i=await img(u);prog(.4);await put('thumbs/'+id,sq(i));await put('full/'+id,jpg(i,1800));prog(.9);
      await put('items/'+id,Object.assign(meta,{kind:'photo'}));
    }else if(f.type.startsWith('video/')||/\.(mov|mp4|m4v)$/i.test(f.name)){
      if(f.size>VIDEO_MAX)throw new Error('מעל 45MB');
      const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
      await new Promise((ok,no)=>{v.onloadeddata=ok;v.onerror=()=>no(new Error('פורמט לא נתמך'))});
      v.currentTime=Math.min(1,(v.duration||2)/3);await new Promise(ok=>{v.onseeked=ok;setTimeout(ok,1500)});
      await put('thumbs/'+id,sq(v));
      const buf=await f.arrayBuffer(),n=Math.ceil(buf.byteLength/CHUNK);
      for(let i=0;i<n;i++){await put(`vid/${id}/${i}`,b64(buf.slice(i*CHUNK,(i+1)*CHUNK)));prog((i+1)/n*.95)}
      await put('items/'+id,Object.assign(meta,{kind:'video',dur:Math.round(v.duration||0),chunks:n,mime:f.type||'video/mp4'}));
    }else throw new Error('סוג לא נתמך');
  }finally{URL.revokeObjectURL(u)}
}
boot();
})();
</script>
