<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Heebo:wght@500;700;900&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#09090b;font-family:Heebo,Arial,sans-serif;position:relative;color:#fff}
.bg{position:absolute;inset:0;background:url(img/hero-larnaca.jpg) center/cover;filter:brightness(.55)}
.rw{position:absolute;left:0;top:0;width:640px;height:630px;background:url(img/rw-a.jpg) 47% 38%/auto 150% no-repeat;filter:brightness(1.9) contrast(1.05) saturate(1.1);
 -webkit-mask-image:linear-gradient(90deg,#000 55%,transparent 100%);mask-image:linear-gradient(90deg,#000 55%,transparent 100%)}

.bar{width:210px;height:5px;background:#e5392f;margin:18px 0 18px auto}
.d{font-weight:900;font-size:40px}
.p{display:flex;gap:14px;justify-content:flex-start;margin-top:20px;direction:rtl}
.p div{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:10px 22px;font-weight:700;font-size:32px}
.p b{font-size:44px;font-weight:900;color:#ffd166;margin-inline-start:6px}
